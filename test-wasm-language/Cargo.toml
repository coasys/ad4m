[package]
name = "test-wasm-language"
version = "0.1.0"
edition = "2021"
authors = ["Nicolas Luck <nicolas.luck@coasys.org>"]
description = "Test WASM language for AD4M"
license = "CAL-1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ad4m-ldk = { path = "../rust-ldk" }
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"

# Use wee_alloc for smaller WASM binary size
wee_alloc = "0.4.5"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
]
