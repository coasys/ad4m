[package]
name = "ad4m-client"
version = "0.13.1-staging.11"
edition = "2021"
authors = ["Nicolas Luck <nicolas@coasys.org>"]
description = "Client library wrapping AD4M's WebSocket RPC interface"
keywords = ["ad4m", "perspect3vism", "cli"]
license = "CAL-1.0"
homepage = "https://ad4m.dev"
repository = "https://github.com/perspect3vism/ad4m"
documentation = "https://docs.ad4m.dev"
readme = "README.md"

# Shared dependencies — everything here compiles for both native targets and
# wasm32-unknown-unknown. `rand` gets its entropy through `getrandom`'s `js`
# feature below (wasm-only dependency table), never a feature flag.
[dependencies]
anyhow = "1.0.65"
serde = { version = "1.0.147", features = ["derive"] }
futures-util = "0.3"
chrono = { version = "0.4.38", features = ["serde"] }
serde_json = "1"
urlencoding = "2"
unicode-width = "0.1"
rand = "0.8"
regex = "1"
maplit = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.25.0", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
clap = { version = "4.0.8", features = ["derive"] }

# Browser (wasm32-unknown-unknown): tokio's `sync` primitives and `select!`
# compile for wasm — spawn/timers can't run, so they go through `rt.rs` onto
# wasm-bindgen-futures + gloo-timers. The WebSocket transport is web-sys
# (`transport/browser.rs`); no feature flag is needed beyond the target.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.25.0", features = ["sync", "macros"] }
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
    "Event",
    "MessageEvent",
    "WebSocket",
    "console",
] }
gloo-timers = { version = "0.3", features = ["futures"] }
futures-channel = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
