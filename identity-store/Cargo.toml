[package]
name = "identity-store"
version = "0.1.0"
edition = "2021"
description = "The shared store of did:scid:coasys:1 key logs: logs, signed heads, the key index, agent records, offers and claims"
license = "CAL-1.0"
homepage = "https://ad4m.dev"
repository = "https://github.com/coasys/ad4m"
publish = false

[[bin]]
name = "identity-store"
path = "src/main.rs"

[dependencies]
ad4m-hash-chain = { path = "../ad4m-hash-chain", features = ["sqlite"] }
ad4m-identity-core = { path = "../ad4m-identity-core", features = ["build"] }
# The wire types shared with the executor and the agent language (`ad4m_ldk::identity`).
ad4m-ldk = { path = "../ad4m-ldk/rust" }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
# Same rusqlite line as ad4m-hash-chain and rust-executor (libsqlite3-sys 0.38, see the root Cargo.toml).
rusqlite = "0.40.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = "2.2.0"
bs58 = "0.5.1"
base64 = "0.22.1"
rand = "0.8.5"
thiserror = "2.0.12"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1.5"
