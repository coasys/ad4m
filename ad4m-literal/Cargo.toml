[package]
name = "ad4m-literal"
version = "0.13.1-staging.16"
edition = "2021"
authors = ["Nicolas Luck <nicolas@coasys.org>"]
description = "AD4M's literal:// URLs: strings, numbers and JSON encoded as expression addresses"
keywords = ["ad4m", "perspect3vism"]
license = "CAL-1.0"
homepage = "https://ad4m.dev"
repository = "https://github.com/perspect3vism/ad4m"
documentation = "https://docs.ad4m.dev"

# Pure Rust, no I/O: it builds for wasm32-unknown-unknown, so the web executor can use it
# without ad4m-client. ad4m-client re-exports it as `ad4m_client::literal`.
[dependencies]
anyhow = "1.0.65"
serde_json = "1"
urlencoding = "2"
