[package]
name = "ad4m"

version = "0.13.1-staging.11"

edition = "2021"
authors = ["Nicolas Luck <nicolas.luck@coasys.org>"]
description = "Executables for running, developing and debugging an ADAM node/agent"
keywords = ["ad4m", "coasys", "cli", "holochain"]
license = "CAL-1.0"
homepage = "https://ad4m.dev"
repository = "https://github.com/coasys/ad4m"
documentation = "https://docs.ad4m.dev"
readme = "README.md"

[[bin]]
name = "ad4m"
path = "src/ad4m.rs"

[[bin]]
name = "ad4m-executor"
path = "src/ad4m_executor.rs"

[features]
default = []

[dependencies]
ad4m-client = { path = "../rust-client", version="0.13.1-staging.11" }
ad4m-executor = { path = "../rust-executor", version="0.13.1-staging.11" }
anyhow = "1.0.65"
clap = { version = "4.6", features = ["derive", "env"] }
futures = "0.3"
tokio = { version = "1.25.0", features = ["full"] }
rustyline = "10"
dirs = "4"
chrono = { version = "0.4.38", features = ["serde"] }
serde_json = "1"
urlencoding = "2"
url = "2"
unicode-width = "0.1"
rand = "0.8"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
colour = "0.7.0"
syntect = "5.0"
serde_cbor = "0.11"
# The WE renderer's terminal frontend. Pinned to the same rev as the whole
# renderer pin (we @ port/bugs1); its ratatui/crossterm types cross
# `TuiApp::render_into`/`handle_key`, so the CLI's own must match exactly.
we-tui = { git = "https://github.com/coasys/we.git", rev = "aebab9a2e0532000bac8458585a55fa080c0333f" }
we-session = { git = "https://github.com/coasys/we.git", rev = "aebab9a2e0532000bac8458585a55fa080c0333f" }
we-template = { git = "https://github.com/coasys/we.git", rev = "aebab9a2e0532000bac8458585a55fa080c0333f" }
we-data = { git = "https://github.com/coasys/we.git", rev = "aebab9a2e0532000bac8458585a55fa080c0333f" }
we-screen = { git = "https://github.com/coasys/we.git", rev = "aebab9a2e0532000bac8458585a55fa080c0333f" }
we-expr = { git = "https://github.com/coasys/we.git", rev = "aebab9a2e0532000bac8458585a55fa080c0333f" }
we-catalog = { git = "https://github.com/coasys/we.git", rev = "aebab9a2e0532000bac8458585a55fa080c0333f" }
we-ad4m = { git = "https://github.com/coasys/we.git", rev = "aebab9a2e0532000bac8458585a55fa080c0333f" }
ratatui = "0.30.2"
crossterm = "0.29.0"

[dev-dependencies]
tempfile = "3"
# The live-executor test rig (`we_ad4m::testkit`) — tests only.
we-ad4m = { git = "https://github.com/coasys/we.git", rev = "aebab9a2e0532000bac8458585a55fa080c0333f", features = ["testkit"] }
# A bare WebSocket upgrade so `Ad4mClient::connect` has a peer in tests.
tokio-tungstenite = "0.21"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"] }
