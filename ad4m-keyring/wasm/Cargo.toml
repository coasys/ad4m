[package]
name = "ad4m-keyring-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen exports of ad4m-keyring for the server link language (deno) and the link server (nodejs): the room-key seal, the X25519 key of a seed and the link-hash key"
license = "CAL-1.0"
homepage = "https://ad4m.dev"
repository = "https://github.com/coasys/ad4m"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ad4m-keyring = { path = ".." }
serde_json = "1.0"
# Cargo.lock's version: build.sh runs the wasm-bindgen CLI of the same version, and the tests
# run under its wasm-bindgen-test-runner.
wasm-bindgen = "=0.2.127"
js-sys = "0.3.104"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
zeroize = "1.8"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
hkdf = "0.12.4"
sha2 = "0.10.8"
