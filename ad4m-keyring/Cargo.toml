[package]
name = "ad4m-keyring"
version = "0.1.0"
edition = "2021"
description = "Versioned symmetric keys, their wraps for data at rest, and the X25519 room-key seal of the server link language"
license = "CAL-1.0"
homepage = "https://ad4m.dev"
repository = "https://github.com/coasys/ad4m"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
hex = "0.4.3"
thiserror = "2.0.12"
# Every buffer that holds a plaintext key.
zeroize = "1.8"
# Wraps for data at rest: XChaCha20-Poly1305 (a random 24-byte nonce per wrap).
chacha20poly1305 = "0.10.1"
# The room-key seal: X25519, HKDF-SHA256 and AES-256-GCM, as the server link language has it.
aes-gcm = "0.10.3"
hkdf = "0.12.4"
sha2 = "0.10.8"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
# The Ed25519-to-X25519 map of a did:key's public key.
curve25519-dalek = "4.1.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }

# getrandom's backend on wasm32: the browser's or Node's crypto (`crypto.getRandomValues`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }

[dev-dependencies]
serde_json = "1.0"
