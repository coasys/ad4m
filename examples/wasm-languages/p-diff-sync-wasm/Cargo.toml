[package]
name = "p-diff-sync-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ad4m-wasm-language-sdk = { path = "../../../wasm-language-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
