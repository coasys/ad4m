[package]
name = "note-store-wasm"
version = "0.1.0"
edition = "2021"
description = "Example AD4M WASM language: a simple note store"

[lib]
crate-type = ["cdylib"]

[dependencies]
ad4m-wasm-language-sdk = { path = "../../../wasm-language-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
