# Drop-in for ad4m-staging.service, for one start only: an agent made before
# the keyring is unlocked once from its passphrase file, and the keyring keeps
# the passphrase from then on. Install it as
#   ~/.config/systemd/user/ad4m-staging.service.d/capture-passphrase.conf
# and remove it (and the passphrase file) once the journal shows
# "The keyring now holds the agent passphrase" or "is no longer needed".
# While it is installed, the unit does not start without the file.
# deploy/staging/README.md, "Upgrading to the encrypted data folder".
[Service]
LoadCredential=unlock-passphrase:%h/.config/ad4m-staging/secrets/unlock-passphrase
Environment=AD4M_UNLOCK_PASSPHRASE_FILE=%d/unlock-passphrase
