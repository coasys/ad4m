# Cargo project configuration for coasys/ad4m
# This file applies to all `cargo` invocations in this workspace,
# including local developer builds — not just CI.

[env]
# Use pre-built rusty_v8 static libraries from our coasys fork releases
# instead of building V8 from source (which takes 2-3 hours).
# Anyone cloning this repo gets the right binaries automatically.
RUSTY_V8_MIRROR = "https://github.com/coasys/rusty_v8/releases/download"

# aws-lc-sys on Windows: use pre-compiled NASM assembly objects shipped with
# the crate instead of trying to invoke NASM at build time. This avoids
# cmake/NASM integration issues on GitHub Actions Windows runners.
# Set here (not in CI env vars) because turborepo may strip env vars before
# they reach cargo build scripts.
AWS_LC_SYS_PREBUILT_NASM = "1"

# CUDA compute capability for bindgen_cuda (candle-kernels build script).
# Must reach the cargo build script directly — turborepo strips step-level
# env vars. Only used when building with --features cuda.
CUDA_COMPUTE_CAP = "80"

# macOS ARM64: use ld_classic linker to generate branch island stubs.
# The binary exceeds ARM64's ±128MB B/BL limit (V8 + ONNX = ~140MB).
# ld_classic automatically inserts branch islands for long-range branches.
# Available on Xcode 15.x (macos-14 CI runner default is 15.4).
# This MUST be in config.toml (not RUSTFLAGS env var) because turborepo
# strips env vars before they reach cargo.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-ld_classic"]

[net]
# Use system git instead of cargo's built-in libgit2.
# Required because coasys/deno.git has heavy chromium submodules
# (wpt, buildtools, abseil-cpp from chromium.googlesource.com) that
# libgit2 auto-fetches but are not needed for building.
git-fetch-with-cli = true
