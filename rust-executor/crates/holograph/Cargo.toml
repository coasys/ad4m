[package]
name = "holograph"
version = "0.1.0"
edition = "2021"
authors = ["Nicolas Luck <nicolas.luck@coasys.org>"]
description = "AD4M Holograph substrate — Kitsune2-backed link-language plumbing"
license = "CAL-1.0"

[lib]
name = "holograph"
path = "src/lib.rs"

[dependencies]
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
ciborium = "0.2"
futures = "0.3"
kitsune2_api = { git = "https://github.com/holochain/kitsune2.git", rev = "320a4d9e622c5f1a6f22d29c8beeb0cb5c333cc3" }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sled = "0.34"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }

# Step 2b — KitsuneRetreiver bridges to the p-diff-sync trait surface.
# Per orchestrator's Option A (see .spike-status/blocker-step-1.5.md):
# acceptable for the holograph crate to pull these in as rlib path-deps
# for the spike. The broader extraction (substrate-neutral data types)
# is parked for PR-B.
perspective_diff_sync = { path = "../../../bootstrap-languages/p-diff-sync/hc-dna/zomes/perspective_diff_sync" }
perspective_diff_sync_integrity = { path = "../../../bootstrap-languages/p-diff-sync/hc-dna/zomes/perspective_diff_sync_integrity" }
hdk = { version = "0.7.0-dev.10", git = "https://github.com/coasys/holochain.git", branch = "0.7.0-dev.16-space-override-coasys" }
holo_hash = { version = "0.7.0-dev.6", git = "https://github.com/coasys/holochain.git", branch = "0.7.0-dev.16-space-override-coasys" }
holochain_serialized_bytes = "=0.0.56"

[dev-dependencies]
once_cell = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
