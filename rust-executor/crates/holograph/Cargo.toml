[package]
name = "holograph"
version = "0.1.0"
edition = "2021"
authors = ["Nicolas Luck <nicolas.luck@coasys.org>"]
description = "AD4M Holograph substrate — Kitsune2-backed link-language plumbing"
license = "CAL-1.0"

[lib]
name = "holograph"
path = "src/lib.rs"

[dependencies]
bytes = "1"
ciborium = "0.2"
futures = "0.3"
kitsune2_api = { git = "https://github.com/holochain/kitsune2.git", rev = "320a4d9e622c5f1a6f22d29c8beeb0cb5c333cc3" }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
sled = "0.34"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
