[package]
name = "ad4m-executor"
version = "0.13.0-test-interpretation-2"
edition = "2021"
authors = ["Nicolas Luck <nicolas.luck@coasys.org>"]
description = "Runtime implementation of AD4M as library - https://ad4m.dev"
keywords = ["ad4m", "perspect3vism", "cli"]
license = "CAL-1.0"
homepage = "https://ad4m.dev"
repository = "https://github.com/perspect3vism/ad4m"
documentation = "https://docs.ad4m.dev"
readme = "README.md"

include = [
    "src/**/*",
    "dapp/dist", # Symlink to the dapp directory
    "build.rs",
    "Cargo.toml"
]

[lib]
name = "rust_executor"
path = "src/lib.rs"

[[bin]]
name = "generate_snapshot"
path = "src/bin/generate_snapshot.rs"

[features]
# Pass metal and cuda features (set through build.rs) through to kalosm
default = []
metal = ["kalosm/metal"]
cuda = ["kalosm/cuda"]
generate_snapshot = []  # Feature flag for snapshot generation mode

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# coasys/deno v2.9.5-coasys-1 folds deno_core + rusty_v8 into the monorepo
# (libs/core/, libs/deno_v8/). All deno-family crates now come from a single
# coasys/deno tag. Underlying v8 pulled from coasys/rusty_v8 v150.4.0-coasys
# via libs/deno_v8/Cargo.toml (git dep). The abseil-namespace patch
# (denoland/rusty_v8#1844 still open upstream) is carried on the rusty_v8
# fork; pre-built V8 binaries published by the coasys-release GH Actions
# workflow on tag push, so this AD4M build gets binary V8, not a 2-3h
# source build.
# deno v2.9.5's monorepo split V8 out into libs/deno_v8 which requires an
# explicit `v8` or `quickjs` feature to pick the JS engine. In pre-monorepo
# deno_core this was implicit (always V8).
#
# Adding `v8` as a direct dep too (renaming to `deno_v8` locally to match
# upstream's alias) with `features = ["v8"]` explicit. deno_core also gets
# the same treatment. Being explicit at both levels because feature
# propagation through git-tagged deps in Cargo.lock generate is unreliable.
# Deno workspace-locally aliases deno_v8 as `v8` with default-features=false
# and features=["simdutf"]. Because feature *unification* per-crate uses the
# alias name, we must declare our extra feature under the SAME alias here.
#
# Setting default-features = false explicitly to override the deno-workspace
# `simdutf` feature — our coasys-release CI didn't build the simdutf variant
# of the V8 prebuilt binaries, only the plain `release` variant, so requesting
# simdutf triggers a 404 for src_binding_simdutf_release_*.rs at build time.
# Direct dep on deno_v8 (real crate name, not aliased) with v8 feature
# explicitly enabled. Aliasing as `v8` locally competed with deno's own
# workspace-alias and broke feature chaining through deno_core::v8 = ["v8/v8"].
deno_v8 = { version = "0.2.0", git = "https://github.com/coasys/deno.git", tag = "v2.9.5-coasys-4", features = ["v8"] }
deno_core = { version = "0.410.0", git = "https://github.com/coasys/deno.git", tag = "v2.9.5-coasys-4", features = ["v8", "reactor-tokio", "v8_use_custom_libcxx"] }
deno_runtime = { version = "0.265.0", git = "https://github.com/coasys/deno.git", tag = "v2.9.5-coasys-4", features = ["transpile", "snapshot"] }
deno_resolver = { version = "0.88.0", git = "https://github.com/coasys/deno.git", tag = "v2.9.5-coasys-4" }
deno_fs = { version = "0.167.0", git = "https://github.com/coasys/deno.git", tag = "v2.9.5-coasys-4" }
deno_lib = { version = "0.75.0", git = "https://github.com/coasys/deno.git", tag = "v2.9.5-coasys-4" }
deno_snapshots = { version = "0.72.0", git = "https://github.com/coasys/deno.git", tag = "v2.9.5-coasys-4" }
# Bumped from =0.1.9 to match what coasys/deno v2.9.5-coasys-1 pins in its
# workspace root (0.1.28). The =0.1.9 exact-pin was set for the old
# deno_core 0.347 world and is now incompatible with the deno v2.9.5
# monorepo which uses sys_traits ^0.1.28 across libs/resolver,
# libs/package_json, libs/cache_dir, libs/dotenv, libs/npmrc, libs/cli_parser.
sys_traits = "0.1.28"
# deno_runtime = {version = "0.162.0", path = "../../deno/runtime"}
tokio = { version = "1.25.0", features = ["full"] }
url = "2.3.1"
urlencoding = "2.1"
percent-encoding = "2"
futures = "0.3.28"
tokio-stream = { version = "0.1.12", features = ["sync"] }
lazy_static = "1.4.0"
signal-hook = "0.3"
chrono = { version = "0.4.6", features = ["serde"] }
env_logger = "0.10.0"
colored = "2.0"
serde_json = "1.0.95"
rmpv = "1"
rmp-serde = "1"
uuid = "1.3.0"
log = "0.4.19"
serde = "1.0.159"
secp256k1 = { version = "0.27.0", features = ["rand", "serde"] }
crypto_box = "0.8.2"
hex = "0.4.3"
argon2 = { version = "0.5.0", features = ["simple"] }
rand = "0.8.5"
base64 = "0.21.0"
rmcp = { version = "0.15.0", features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["cors", "set-header", "catch-panic"] }
schemars = "1.0"
clap = { version = "4.0.8", features = ["derive"] }
fs_extra = "1.3.0"
os_info = "3.7.0"
semver = "1.0.17"
did-key = "0.2.1"
zip = "0.6.4"
multibase = "0.9.1"
# cid 0.10.1 pulls core2 ^0.4, but core2 0.4.0 was yanked from crates.io.
# Bumped to cid 0.11 + multihash 0.19 + multihash-codetable 0.2. Same fix
# pattern as noted in MEMORY.md from the earlier HC 0.7.0 attempt.
#
# multihash 0.19 dropped per-hash features (no more "sha2"/"sha3"/etc.);
# hash codes moved to a separate multihash-codetable crate. Source imports
# for Code / MultihashDigest updated accordingly.
multihash = { version = "0.19" }
multihash-codetable = { version = "0.2", features = ["sha2"] }
cid = "0.11"
once_cell = "1.17.1"
rust-embed="8.0.0"
dirs = "5.0.1"
rocket = "0.5.0"


jsonwebtoken = "8.3.0"

webbrowser = "0.8.12"

# holochain = { version = "0.5.2", features = ["test_utils", "default"] }
# holochain_cli_bundle = { version = "0.5.2" }
# holochain_types = { version = "0.5.2" }
holochain_cli_run_local_services = { version = "0.5.0-dev.12" }
kitsune_p2p_types = { version = "0.5.0-dev.9" }
#kitsune2_api = "0.1.15"
# Bumped to HC 0.7.0 stable (from 0.7.0-dev.16). Now compiles cleanly against
# modern serde (1.0.228+) because deno_ast 0.53.3 (from coasys/deno v2.9.5)
# pulls swc_common 14.0.4+ which was rewritten for the serde-core split.
# Features updated for 0.7.0 stable naming: sqlite-encrypted → encryption,
# wasmer_sys → wasmer-sys-cranelift, transport-iroh dropped (not a feature
# on 0.7.0 stable).
# TEMPORARY (diagnostic-only, 2026-08-25): pointing at coasys-netdiag-remove-cells
# branch which adds a WARN + backtrace log to Conductor::remove_cells so we
# can pinpoint which caller is churning running_cells in the multi-user CI.
# Revert to branch = "0.7.0-space-override-coasys" once the root cause is
# identified and fixed.
holochain = { version = "0.7.0", default-features = false, features = ["test_utils", "encryption", "schema", "wasmer-sys-cranelift"], git = "https://github.com/coasys/holochain.git", branch = "coasys-netdiag-remove-cells" }
holochain_cli_bundle = { version = "0.7.0", git = "https://github.com/coasys/holochain.git", branch = "coasys-netdiag-remove-cells" }
holochain_types = { version = "0.7.0", git = "https://github.com/coasys/holochain.git", branch = "coasys-netdiag-remove-cells" }
# Bumped from 0.6.3 to 0.7.1 to match HC 0.7.0 stable (which pins lair 0.7.1).
# Using upstream lair 0.7.1 directly — no fork needed anymore. The old
# coasys/lair 0.7.1-coasys fork existed only to downgrade rusqlite to 0.34
# for compat with the OLD coasys/deno. Now that deno v2.9.5 uses rusqlite
# ^0.40, upstream lair 0.7.1 (also on rusqlite ^0.40) works cleanly.
lair_keystore_api = "0.7.1"
sodoken = "=0.1.0"

scryer-prolog = { version = "0.10", git = "https://github.com/coasys/scryer-prolog", branch = "ad4m" }
# scryer-prolog = { path = "../../scryer-prolog", features = ["multi_thread"] }

ad4m-client = { path = "../rust-client", version="0.13.0-test-interpretation-2" }
reqwest = { version = "0.11.20", features = ["json", "native-tls"] }

# rusqlite = { version = "0.29.0", git = "https://github.com/coasys/rusqlite.git", rev = "12ec1330bd4b46411ab9895364da4a3e172d0fbb", features = ["bundled"] }
# Bumped from 0.34 to 0.40 to match coasys/deno v2.9.5's deno_cache which pins
# rusqlite ^0.40. AD4M's rusqlite usage in src/db.rs is stable API only
# (Connection::open, conn.execute, OptionalExtension) so the bump is free.
# Also lets us drop the whole [patch.crates-io] for lair (which only existed
# to force rusqlite 0.34 alignment with the OLD deno).
rusqlite = "0.40.0"
fake = { version = "2.9.2", features = ["derive"] }
sha2 = "0.10.8"
regex = "1.5.4"
json5 = "0.4"
serde_yaml = "0.9"
rayon = "1.7.0"  # For parallel processing in filtering optimization
lettre = "0.11"  # For sending verification emails via SMTP

include_dir = "0.6.0"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
x509-parser = "0.16"

kalosm = { version = "0.3.2", git = "https://github.com/coasys/floneum.git", branch = "coasys-2-without-pdf", features = ["language", "sound"] }
voice_activity_detector = "0.1.1"
candle-core = "0.8.2"
deflate = "1.0.0"
futures-core = "0.3.30"
futures-util = "0.3.30"
futures-channel = "0.3.30"
rodio = "*"
libc = "0.2"
chat-gpt-lib-rs = { version = "0.5.1", git = "https://github.com/coasys/chat-gpt-lib-rs" }
anyhow = "1.0.95"
portpicker = "0.1.1"
# Bumped from 0.5.6 to 0.7.x to match what deno v2.9.5's deno_ops #[op2]
# macro expects. Old version co-existed in the tree (from other transitives)
# and my JsErrorClass impl on AnyhowWrapperError was against the wrong copy,
# leaving the op2-generated code seeing an unimplemented trait.
deno_error = "0.7"
thiserror = "2.0.12"
oxigraph = { version = "0.5.7", features = ["rocksdb", "rdf-12"] }
ts-rs = { version = "12.0.1", features = ["serde-compat", "no-serde-warnings"] }
tower-service = "0.3"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }

[dev-dependencies]
tempfile = "3"
maplit = "1.0.2"
lazy_static = "1.4.0"
itertools = "0.10.1"
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"
http-body-util = "0.1"

[build-dependencies]
fs_extra = "1.3.0"


# Force static CRT on Windows MSVC to match libort_sys (ONNX Runtime) and avoid LNK2038 mismatch
[target.'cfg(target_env = "msvc")'.dependencies]
# aws-lc-sys: use pre-compiled NASM assembly objects on Windows.
# Without this, aws-lc-sys needs NASM installed and cmake integration which
# fails on MSVC. The prebuilt-nasm feature ships .obj files in the crate.
aws-lc-sys = { version = "0.35", features = ["prebuilt-nasm"] }

# macOS ARM64: ONNX Runtime static lib is too large for ARM64 branch instructions
# (b(l) range ±128MB). load-dynamic links ort at runtime instead of statically,
# reducing binary size below the ARM64 branch limit.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "2.0.0-rc.4", features = ["load-dynamic"] }

[patch.crates-io]
rusqlite = { version = "0.40.0" }
