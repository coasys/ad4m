version: 2.1
references:
  ad4m_image: &ad4m_image coasys/ad4m-ci-linux:latest@sha256:a0ab4b6358b7314a2ad49e232ba6c53b28a56e7f02641f226b2ed05544cc66d8

commands:
  setup_env:
    description: "Set up build environment (Node, Rust, Deno, Go, pnpm)"
    parameters:
      node_version:
        type: string
        default: "24"
    steps:
      - run:
          name: Setup build environment
          command: |
            # Prefer Node already on PATH (e.g. Docker CI image)
            CURRENT_NODE_MAJOR=$(node --version 2>/dev/null | sed 's/^v\([0-9]*\).*/\1/' || echo "0")
            if [ "$CURRENT_NODE_MAJOR" = "<< parameters.node_version >>" ]; then
              echo "Node << parameters.node_version >> already on PATH: $(node --version)"
              NODE_BIN_DIR=$(dirname "$(which node)")
            else
              # Fall back to nvm if available
              export NVM_DIR="$HOME/.nvm"
              if [ -s "$NVM_DIR/nvm.sh" ]; then
                . "$NVM_DIR/nvm.sh" --no-use
                NODE_PATH=$(nvm which << parameters.node_version >> 2>/dev/null || true)
                if [ -z "$NODE_PATH" ] || [ ! -x "$NODE_PATH" ]; then
                  echo "Node << parameters.node_version >> not found via nvm, installing..."
                  nvm install << parameters.node_version >>
                  NODE_PATH=$(nvm which << parameters.node_version >>)
                fi
                NODE_BIN_DIR=$(dirname "$NODE_PATH")
              else
                echo "ERROR: Node << parameters.node_version >> not found and nvm not available"
                exit 1
              fi
            fi
            echo "export PATH=\"$NODE_BIN_DIR:$HOME/.cargo/bin:$HOME/.deno/bin:$HOME/.local/go/bin:$HOME/.npm-global/bin:$HOME/.local/bin:$HOME/go/bin:$PATH\"" >> $BASH_ENV
            source $BASH_ENV
            # Ensure pnpm is available
            if ! command -v pnpm &>/dev/null; then
              echo "pnpm not found, installing..."
              npm install -g pnpm
            fi
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "Rust: $(rustc --version 2>/dev/null || echo 'not installed')"
            echo "Deno: $(deno --version 2>/dev/null | head -1 || echo 'not installed')"
            echo "Go: $(go version 2>/dev/null || echo 'not installed')"
            echo "pnpm: $(pnpm --version)"

  setup_integration_test_environment:
    description: "Setup common integration test environment"
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Restore binaries from workspace
          command: |
            mkdir -p target/release
            cp /tmp/workspace/release/ad4m target/release/ad4m
            cp /tmp/workspace/release/ad4m-executor target/release/ad4m-executor
      - setup_env
      - run:
          name: Install dependencies
          command: pnpm install --no-frozen-lockfile
      - run:
          name: Install core dependencies
          command: cd ./core && pnpm install --no-frozen-lockfile
      - run:
          name: Build core package
          command: cd ./core && pnpm run build
      - run:
          name: Build bootstrap languages
          command: pnpm run build-languages

jobs:
  build-and-test:
    docker:
      - image: *ad4m_image
    resource_class: large
    steps:
      - checkout
      - setup_env
      - run:
          name: cargo fmt --check
          command: cargo fmt --check
      - run:
          name: Install dependencies
          command: pnpm install --no-frozen-lockfile
      - run:
          name: Build dapp
          command: pnpm build-dapp
      - run:
          name: Install core dependencies
          command: cd ./core && pnpm install --no-frozen-lockfile
      - run:
          name: Build deno snapshot
          command: pnpm run build-deno-snapshot
          no_output_timeout: 30m
      - run:
          name: Remove stale binaries (self-hosted runner incremental cache)
          command: rm -f target/release/ad4m target/release/ad4m-executor
      - run:
          name: Build ADAM (without bootstrap languages)
          command: pnpm run build-libs
          no_output_timeout: 30m
      - run:
          name: cargo clippy
          no_output_timeout: 30m
          command: cargo clippy --all --exclude ad4m-launcher
      - run:
          name: Copy binaries for workspace
          command: |
            mkdir -p /tmp/workspace/release
            cp target/release/ad4m target/release/ad4m-executor /tmp/workspace/release/
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - release
      - run:
          name: Remove pnpm patches
          command: node removePnpm.js
      - run:
          name: Install dependencies
          command: pnpm install --no-frozen-lockfile
      - run:
          name: Install core dependencies
          command: cd ./core && pnpm install --no-frozen-lockfile
      - run:
          name: Root tests
          command: pnpm test
          no_output_timeout: 30m

  integration-tests-js:
    docker:
      - image: *ad4m_image
    resource_class: large
    steps:
      - setup_integration_test_environment
      - run:
          name: Run integration tests
          command: cd ./tests/js && pnpm run test-main
          no_output_timeout: 30m
      - run:
          name: Collect logs on failure
          when: always
          command: |
            mkdir -p /tmp/test-artifacts
            shopt -s nullglob
            for ad4m_dir in tests/js/tst-tmp/agents/*/ad4m; do
              agent_id="$(basename "$(dirname "$ad4m_dir")")"
              mkdir -p "/tmp/test-artifacts/$agent_id"
              cp -r "$ad4m_dir/logs" "/tmp/test-artifacts/$agent_id/" 2>/dev/null || true
              cp -r "$ad4m_dir/holochain" "/tmp/test-artifacts/$agent_id/" 2>/dev/null || true
            done
            # Capture port state for debugging
            lsof -i -P -n 2>/dev/null | grep LISTEN > /tmp/test-artifacts/listening-ports.txt || true
      - store_artifacts:
          when: always
          path: /tmp/test-artifacts
          destination: test-logs

  integration-tests-multi-user-simple:
    docker:
      - image: *ad4m_image
    resource_class: large
    steps:
      - setup_integration_test_environment
      - run:
          name: Run multi-user-simple integration tests
          command: cd ./tests/js && ./test-multi-user-with-setup.sh
          no_output_timeout: 30m

  integration-tests-email-verification:
    docker:
      - image: *ad4m_image
    resource_class: large
    steps:
      - setup_integration_test_environment
      - run:
          name: Run email-verification integration tests
          command: cd ./tests/js && ./email-verification-test-with-setup.sh
          no_output_timeout: 30m

  integration-tests-mcp:
    docker:
      - image: *ad4m_image
    resource_class: large
    steps:
      - setup_integration_test_environment
      - run:
          name: Run MCP integration tests
          command: cd ./tests/js && pnpm install && pnpm run test-mcp
          no_output_timeout: 30m

  integration-tests-model:
    docker:
      - image: *ad4m_image
    resource_class: large
    steps:
      - setup_integration_test_environment
      - run:
          name: Run Ad4mModel unit + integration tests
          command: cd ./tests/js && pnpm run test-model
          no_output_timeout: 30m

  integration-tests-cli:
    docker:
      - image: *ad4m_image
    resource_class: large
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Restore binaries from workspace
          command: |
            mkdir -p target/release
            cp /tmp/workspace/release/ad4m target/release/ad4m
            cp /tmp/workspace/release/ad4m-executor target/release/ad4m-executor
      - setup_env
      - run:
          name: git submodule
          command: git submodule update --init --recursive
      - run:
          name: Run binaries test script
          command: ./tests/bats/bin/bats tests/binaries.bats
      - run:
          name: Run integration test script
          command: ./tests/bats/bin/bats tests/integration.bats

  plugin-ad4m-tests:
    docker:
      - image: *ad4m_image
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install dependencies
          working_directory: plugins/ad4m
          command: npm install
      - run:
          name: Run tests
          working_directory: plugins/ad4m
          command: npm test

workflows:
  version: 2
  build-and-test:
    jobs:
      - build-and-test
      - plugin-ad4m-tests
      - integration-tests-js:
          requires:
            - build-and-test
      - integration-tests-multi-user-simple:
          requires:
            - build-and-test
      - integration-tests-email-verification:
          requires:
            - build-and-test
      - integration-tests-mcp:
          requires:
            - build-and-test
      - integration-tests-model:
          requires:
            - build-and-test
