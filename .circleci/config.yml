version: 2.1
references:
  ad4m_image: &ad4m_image coasys/ad4m-ci-linux:latest@sha256:3605cfd2c0aee389ac9e7bb499a8e2633d0367ef3cc148d6668b2dbdff846ce0

# Self-hosted machine runner on marvin (AMD Ryzen 9 9950X, 60GB RAM, Ubuntu 25.04)
# Resource class: coasys/marvin

commands:
  setup_env:
    description: "Set up build environment (Node 24, Rust, Deno, Go, pnpm)"
    steps:
      - run:
          name: Setup build environment
          command: |
            # Add all tool paths directly to PATH — no NVM sourcing (nvm use prints to stdout
            # which corrupts subshell commands in cargo build scripts like libffi's libtool)
            echo 'export PATH="$HOME/.nvm/versions/node/v24.14.0/bin:$HOME/.cargo/bin:$HOME/.deno/bin:$HOME/.local/go/bin:$HOME/.npm-global/bin:$HOME/.local/bin:$HOME/go/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "Rust: $(rustc --version)"
            echo "Deno: $(deno --version | head -1)"
            echo "Go: $(go version)"
            echo "pnpm: $(pnpm --version)"

  setup_integration_test_environment:
    description: "Setup common integration test environment"
    steps:
      - checkout
      - run:
          name: Restore binaries from local stash (no CircleCI network storage needed — same host)
          command: |
            mkdir -p target/release
            cp /tmp/circleci-artifacts/${CIRCLE_WORKFLOW_ID}/ad4m target/release/ad4m
            cp /tmp/circleci-artifacts/${CIRCLE_WORKFLOW_ID}/ad4m-executor target/release/ad4m-executor
      - setup_env
      - run:
          name: Install dependencies
          command: pnpm install --no-frozen-lockfile
      - run:
          name: Install core dependencies
          command: cd ./core && pnpm install --no-frozen-lockfile
      - run:
          name: Build bootstrap languages
          command: pnpm run build-languages


jobs:
  build-and-test:
    machine: true
    resource_class: coasys/marvin
    steps:
      - checkout
      - setup_env
      - run:
          name: Clean up stale local artifact stashes (older than 1 day)
          command: |
            find /tmp/circleci-artifacts -maxdepth 1 -mindepth 1 -mtime +1 -exec rm -rf {} + 2>/dev/null || true
      - run:
          name: cargo fmt --check
          command: cargo fmt --check
      - run:
          name: Install dependencies
          command: pnpm install --no-frozen-lockfile
      - run:
          name: Build dapp
          command: pnpm build-dapp
      - run:
          name: Install core dependencies
          command: cd ./core && pnpm install --no-frozen-lockfile
      - run:
          name: Build core executor
          command: pnpm run build-core-executor
      - run:
          name: Build deno snapshot
          command: pnpm run build-deno-snapshot
          no_output_timeout: 30m
      - run:
          name: Build ADAM (without bootstrap languages)
          command: pnpm run build-libs
          no_output_timeout: 30m
      - run:
          name: cargo clippy
          no_output_timeout: 30m
          command: cargo clippy --all --exclude ad4m-launcher
      - run:
          name: Stash binaries locally (skip CircleCI network storage — all jobs run on same host)
          command: |
            mkdir -p /tmp/circleci-artifacts/${CIRCLE_WORKFLOW_ID}
            cp target/release/ad4m target/release/ad4m-executor /tmp/circleci-artifacts/${CIRCLE_WORKFLOW_ID}/
      - run:
          name: Remove pnpm patches
          command: node removePnpm.js
      - run:
          name: Install dependencies
          command: pnpm install --no-frozen-lockfile
      - run:
          name: Install core dependencies
          command: cd ./core && pnpm install --no-frozen-lockfile
      - run:
          name: Root tests
          command: pnpm test
          no_output_timeout: 30m

  integration-tests-js:
    machine: true
    resource_class: coasys/marvin
    steps:
      - setup_integration_test_environment
      - run:
          name: Kill any orphaned executors from previous runs
          command: |
            # Self-hosted runners reuse workdirs; previous job may have left
            # an executor alive (exec() shell-wrap means kill() only kills
            # the shell, not the executor grandchild). Clear ALL test ports
            # before starting, not just setup ports.
            for port in 15000 15001 15002 15100 15101 15102 15200 15201 15202 15203 \
                        15300 15301 15302 15400 15401 15402 \
                        15600 15601 15602 15700 15701 15702 \
                        16600 16601 16602; do
              lsof -ti:$port | xargs -r kill -9 2>/dev/null || true
            done
      - run:
          name: Run integration tests
          command: cd ./tests/js && pnpm run test-main
          no_output_timeout: 30m

  integration-tests-multi-user-simple:
    machine: true
    resource_class: coasys/marvin
    steps:
      - setup_integration_test_environment
      - run:
          name: Run multi-user-simple integration tests
          command: cd ./tests/js && ./test-multi-user-with-setup.sh
          no_output_timeout: 30m

  integration-tests-email-verification:
    machine: true
    resource_class: coasys/marvin
    steps:
      - setup_integration_test_environment
      - run:
          name: Run email-verification integration tests
          command: cd ./tests/js && ./email-verification-test-with-setup.sh
          no_output_timeout: 30m

  integration-tests-cli:
    machine: true
    resource_class: coasys/marvin
    steps:
      - checkout
      - run:
          name: Restore binaries from local stash
          command: |
            mkdir -p target/release
            cp /tmp/circleci-artifacts/${CIRCLE_WORKFLOW_ID}/ad4m target/release/ad4m
            cp /tmp/circleci-artifacts/${CIRCLE_WORKFLOW_ID}/ad4m-executor target/release/ad4m-executor
      - setup_env
      - run:
          name: git submodule
          command: git submodule update --init --recursive
      - run:
          name: Run binaries test script
          command: ./tests/bats/bin/bats tests/binaries.bats
      - run:
          name: Run integration test script
          command: ./tests/bats/bin/bats tests/integration.bats

workflows:
  version: 2
  build-and-test:
    jobs:
      - build-and-test
      - integration-tests-js:
          requires:
            - build-and-test
      - integration-tests-multi-user-simple:
          requires:
            - build-and-test
      - integration-tests-email-verification:
          requires:
            - build-and-test
