version: 2.1
references:
  ad4m_image: &ad4m_image coasys/ad4m-ci-linux:latest@sha256:27f8c304877b03c74551175fc7727cfdd32b13fa6bb229d3fa18cee47889df4c

# Self-hosted machine runner on marvin (AMD Ryzen 9 9950X, 60GB RAM, Ubuntu 25.04)
# Resource class: coasys/marvin
#
# All build and test steps run inside the coasys/ad4m-ci-linux Docker container
# (Ubuntu 22.04). This gives:
#   - Clean process isolation: container exit kills all child processes
#   - glibc compatibility: binaries built inside the same container they run in
#   - No orphaned executors between test runs

# Run as host user with circleci group access — files written to workspace owned by host user
commands:
  setup_env:
    description: "Set up build environment (used for host-side non-Docker steps only)"
    steps:
      - run:
          name: Setup build environment
          command: |
            echo 'export PATH="$HOME/.nvm/versions/node/v18.20.8/bin:$HOME/.cargo/bin:$HOME/.deno/bin:$HOME/.local/go/bin:$HOME/.npm-global/bin:$HOME/.local/bin:$HOME/go/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            echo "Node: $(node --version)"
            echo "pnpm: $(pnpm --version)"

  setup_integration_test_environment:
    description: "Checkout + restore binaries + install deps + build languages (on host)"
    steps:
      - checkout
      - run:
          name: Restore binaries from local stash
          command: |
            mkdir -p target/release
            cp /tmp/circleci-artifacts/${CIRCLE_WORKFLOW_ID}/ad4m target/release/ad4m
            cp /tmp/circleci-artifacts/${CIRCLE_WORKFLOW_ID}/ad4m-executor target/release/ad4m-executor
      - setup_env
      - run:
          name: Install dependencies
          command: pnpm install --no-frozen-lockfile
      - run:
          name: Install core dependencies
          command: cd ./core && pnpm install --no-frozen-lockfile
      - run:
          name: Build bootstrap languages
          command: pnpm run build-languages


jobs:
  build-and-test:
    machine: true
    resource_class: coasys/marvin
    steps:
      - checkout
      - run:
          name: Clean up stale local artifact stashes (older than 1 day)
          command: |
            find /tmp/circleci-artifacts -maxdepth 1 -mindepth 1 -mtime +1 -exec rm -rf {} + 2>/dev/null || true
      - run:
          name: Remove stale build artifacts (host-side, no Docker overhead)
          command: |
            # Remove node_modules and target/ so the build starts clean.
            # All files are now marvin-owned (fixed root ownership issue) so
            # we can rm directly — no need for a Docker container.
            rm -rf node_modules core/node_modules target 2>/dev/null || true
      - run:
          name: Build and test inside Docker (coasys/ad4m-ci-linux)
          no_output_timeout: 60m
          command: |
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --group-add 1002 \
              -e HOME=/workspace/.ci-home \
              -e CARGO_HOME=/home/circleci/.cargo \
              -e RUSTUP_HOME=/home/circleci/.rustup \
              -e DENO_DIR=/workspace/.ci-home/.deno \
              -e CI=true \
              -e ELECTRON_SKIP_BINARY_DOWNLOAD=1 \
              -e npm_config_cache=/workspace/.ci-home/.npm-cache \
              -v "$(pwd):/workspace" \
              -w /workspace \
              coasys/ad4m-ci-linux:latest@sha256:27f8c304877b03c74551175fc7727cfdd32b13fa6bb229d3fa18cee47889df4c \
              bash -c "
                set -euo pipefail
                mkdir -p /workspace/.ci-home
                cargo fmt --check
                pnpm install --no-frozen-lockfile
                pnpm build-dapp
                cd core && pnpm install --no-frozen-lockfile && cd ..
                pnpm run build-core-executor
                pnpm run build-deno-snapshot
                pnpm run build-libs
                cargo clippy --all --exclude ad4m-launcher
                node removePnpm.js
                pnpm install --no-frozen-lockfile
                cd core && pnpm install --no-frozen-lockfile && cd ..
                pnpm test
              "
      - run:
          name: Stash binaries for integration test jobs
          command: |
            mkdir -p /tmp/circleci-artifacts/${CIRCLE_WORKFLOW_ID}
            cp target/release/ad4m target/release/ad4m-executor /tmp/circleci-artifacts/${CIRCLE_WORKFLOW_ID}/

  integration-tests-js:
    machine: true
    resource_class: coasys/marvin
    steps:
      - setup_integration_test_environment
      - run:
          name: Run integration tests inside Docker
          no_output_timeout: 30m
          command: |
            docker run --rm \
              --network host \
              --user "$(id -u):$(id -g)" \
              --group-add 1002 \
              -e HOME=/workspace/.ci-home \
              -e CARGO_HOME=/home/circleci/.cargo \
              -e RUSTUP_HOME=/home/circleci/.rustup \
              -e CI=true \
              -v "$(pwd):/workspace" \
              -w /workspace \
              coasys/ad4m-ci-linux:latest@sha256:27f8c304877b03c74551175fc7727cfdd32b13fa6bb229d3fa18cee47889df4c \
              bash -c "mkdir -p /workspace/.ci-home && cd tests/js && pnpm run test-main"

  integration-tests-multi-user-simple:
    machine: true
    resource_class: coasys/marvin
    steps:
      - setup_integration_test_environment
      - run:
          name: Run multi-user-simple integration tests inside Docker
          no_output_timeout: 30m
          command: |
            docker run --rm \
              --network host \
              --user "$(id -u):$(id -g)" \
              --group-add 1002 \
              -e HOME=/workspace/.ci-home \
              -e CARGO_HOME=/home/circleci/.cargo \
              -e RUSTUP_HOME=/home/circleci/.rustup \
              -e CI=true \
              -v "$(pwd):/workspace" \
              -w /workspace \
              coasys/ad4m-ci-linux:latest@sha256:27f8c304877b03c74551175fc7727cfdd32b13fa6bb229d3fa18cee47889df4c \
              bash -c "mkdir -p /workspace/.ci-home && cd tests/js && ./test-multi-user-with-setup.sh"

  integration-tests-email-verification:
    machine: true
    resource_class: coasys/marvin
    steps:
      - setup_integration_test_environment
      - run:
          name: Run email-verification integration tests inside Docker
          no_output_timeout: 30m
          command: |
            docker run --rm \
              --network host \
              --user "$(id -u):$(id -g)" \
              --group-add 1002 \
              -e HOME=/workspace/.ci-home \
              -e CARGO_HOME=/home/circleci/.cargo \
              -e RUSTUP_HOME=/home/circleci/.rustup \
              -e CI=true \
              -v "$(pwd):/workspace" \
              -w /workspace \
              coasys/ad4m-ci-linux:latest@sha256:27f8c304877b03c74551175fc7727cfdd32b13fa6bb229d3fa18cee47889df4c \
              bash -c "mkdir -p /workspace/.ci-home && cd tests/js && ./email-verification-test-with-setup.sh"

  integration-tests-cli:
    machine: true
    resource_class: coasys/marvin
    steps:
      - checkout
      - run:
          name: Restore binaries from local stash
          command: |
            mkdir -p target/release
            cp /tmp/circleci-artifacts/${CIRCLE_WORKFLOW_ID}/ad4m target/release/ad4m
            cp /tmp/circleci-artifacts/${CIRCLE_WORKFLOW_ID}/ad4m-executor target/release/ad4m-executor
      - setup_env
      - run:
          name: git submodule
          command: git submodule update --init --recursive
      - run:
          name: Run binaries test script
          command: ./tests/bats/bin/bats tests/binaries.bats
      - run:
          name: Run integration test script
          command: ./tests/bats/bin/bats tests/integration.bats

workflows:
  version: 2
  build-and-test:
    jobs:
      - build-and-test
      - integration-tests-js:
          requires:
            - build-and-test
      - integration-tests-multi-user-simple:
          requires:
            - build-and-test
      - integration-tests-email-verification:
          requires:
            - build-and-test
