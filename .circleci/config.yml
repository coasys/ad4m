version: 2.1
references:
  ad4m_image: &ad4m_image coasys/ad4m-ci-linux:latest@sha256:27f8c304877b03c74551175fc7727cfdd32b13fa6bb229d3fa18cee47889df4c

# Self-hosted machine runner on marvin (AMD Ryzen 9 9950X, 60GB RAM, Ubuntu 25.04)
# Resource class: coasys/marvin

commands:
  setup_env:
    description: "Set up build environment (Node 18, Rust, Deno, Go, pnpm)"
    steps:
      - run:
          name: Setup build environment
          command: |
            # Add all tool paths directly to PATH — no NVM sourcing (nvm use prints to stdout
            # which corrupts subshell commands in cargo build scripts like libffi's libtool)
            echo 'export PATH="$HOME/.nvm/versions/node/v18.20.8/bin:$HOME/.cargo/bin:$HOME/.deno/bin:$HOME/.local/go/bin:$HOME/.npm-global/bin:$HOME/.local/bin:$HOME/go/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "Rust: $(rustc --version)"
            echo "Deno: $(deno --version | head -1)"
            echo "Go: $(go version)"
            echo "pnpm: $(pnpm --version)"

  setup_integration_test_environment:
    description: "Setup common integration test environment"
    steps:
      - checkout
      - run:
          name: Restore binaries from local stash (no CircleCI network storage needed — same host)
          command: |
            mkdir -p target/release
            cp /tmp/circleci-artifacts/${CIRCLE_WORKFLOW_ID}/ad4m target/release/ad4m
            cp /tmp/circleci-artifacts/${CIRCLE_WORKFLOW_ID}/ad4m-executor target/release/ad4m-executor
      - setup_env
      - run:
          name: Install dependencies
          command: pnpm install --no-frozen-lockfile
      - run:
          name: Install core dependencies
          command: cd ./core && pnpm install --no-frozen-lockfile
      - run:
          name: Build bootstrap languages
          command: pnpm run build-languages


jobs:
  build-and-test:
    machine: true
    resource_class: coasys/marvin
    steps:
      - checkout
      - run:
          name: Clean up stale local artifact stashes (older than 1 day)
          command: |
            find /tmp/circleci-artifacts -maxdepth 1 -mindepth 1 -mtime +1 -exec rm -rf {} + 2>/dev/null || true
      - run:
          name: Build and test inside Docker (ensures binary is glibc-compatible with test containers)
          no_output_timeout: 60m
          command: |
            docker run --rm \
              --user root \
              -e HOME=/home/circleci \
              -e PATH="/home/circleci/.cargo/bin:/home/circleci/.deno/bin:/home/circleci/.npm-global/bin:/home/circleci/bin:/home/circleci/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              -v "$(pwd):/home/circleci/project" \
              -v "$HOME/.cargo/registry:/home/circleci/.cargo/registry" \
              -v "$HOME/.cargo/git:/home/circleci/.cargo/git" \
              -w /home/circleci/project \
              coasys/ad4m-ci-linux:latest@sha256:27f8c304877b03c74551175fc7727cfdd32b13fa6bb229d3fa18cee47889df4c \
              bash -c "
                set -e
                cargo fmt --check
                pnpm install --no-frozen-lockfile
                pnpm build-dapp
                cd ./core && pnpm install --no-frozen-lockfile && cd ..
                pnpm run build-core-executor
                pnpm run build-deno-snapshot
                pnpm run build-libs
                cargo clippy --all --exclude ad4m-launcher
                node removePnpm.js
                pnpm install --no-frozen-lockfile
                cd ./core && pnpm install --no-frozen-lockfile && cd ..
                pnpm test
              "
      - run:
          name: Stash binaries locally (skip CircleCI network storage — all jobs run on same host)
          command: |
            mkdir -p /tmp/circleci-artifacts/${CIRCLE_WORKFLOW_ID}
            cp target/release/ad4m target/release/ad4m-executor /tmp/circleci-artifacts/${CIRCLE_WORKFLOW_ID}/

  integration-tests-js:
    machine: true
    resource_class: coasys/marvin
    steps:
      - setup_integration_test_environment
      - run:
          name: Run integration tests in Docker
          command: |
            # Remove stale tst-tmp from previous runs before starting a fresh container.
            # (The container will recreate it via prepare-test.)
            rm -rf ./tests/js/tst-tmp
            docker run --rm \
              --user root \
              -e HOME=/home/circleci \
              -e PATH="/home/circleci/.cargo/bin:/home/circleci/.deno/bin:/home/circleci/.npm-global/bin:/home/circleci/bin:/home/circleci/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              -v "$(pwd):/home/circleci/project" \
              -w /home/circleci/project \
              coasys/ad4m-ci-linux:latest@sha256:27f8c304877b03c74551175fc7727cfdd32b13fa6bb229d3fa18cee47889df4c \
              bash -c "cd tests/js && pnpm run test-main"
          no_output_timeout: 30m

  integration-tests-multi-user-simple:
    machine: true
    resource_class: coasys/marvin
    steps:
      - setup_integration_test_environment
      - run:
          name: Run multi-user-simple integration tests in Docker
          command: |
            rm -rf ./tests/js/tst-tmp
            docker run --rm \
              --user root \
              -e HOME=/home/circleci \
              -e PATH="/home/circleci/.cargo/bin:/home/circleci/.deno/bin:/home/circleci/.npm-global/bin:/home/circleci/bin:/home/circleci/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              -v "$(pwd):/home/circleci/project" \
              -w /home/circleci/project \
              coasys/ad4m-ci-linux:latest@sha256:27f8c304877b03c74551175fc7727cfdd32b13fa6bb229d3fa18cee47889df4c \
              bash -c "cd tests/js && ./test-multi-user-with-setup.sh"
          no_output_timeout: 30m

  integration-tests-email-verification:
    machine: true
    resource_class: coasys/marvin
    steps:
      - setup_integration_test_environment
      - run:
          name: Run email-verification integration tests in Docker
          command: |
            rm -rf ./tests/js/tst-tmp
            docker run --rm \
              --user root \
              -e HOME=/home/circleci \
              -e PATH="/home/circleci/.cargo/bin:/home/circleci/.deno/bin:/home/circleci/.npm-global/bin:/home/circleci/bin:/home/circleci/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              -v "$(pwd):/home/circleci/project" \
              -w /home/circleci/project \
              coasys/ad4m-ci-linux:latest@sha256:27f8c304877b03c74551175fc7727cfdd32b13fa6bb229d3fa18cee47889df4c \
              bash -c "cd tests/js && ./email-verification-test-with-setup.sh"
          no_output_timeout: 30m

  integration-tests-cli:
    machine: true
    resource_class: coasys/marvin
    steps:
      - checkout
      - run:
          name: Restore binaries from local stash
          command: |
            mkdir -p target/release
            cp /tmp/circleci-artifacts/${CIRCLE_WORKFLOW_ID}/ad4m target/release/ad4m
            cp /tmp/circleci-artifacts/${CIRCLE_WORKFLOW_ID}/ad4m-executor target/release/ad4m-executor
      - setup_env
      - run:
          name: git submodule
          command: git submodule update --init --recursive
      - run:
          name: Run binaries test script
          command: ./tests/bats/bin/bats tests/binaries.bats
      - run:
          name: Run integration test script
          command: ./tests/bats/bin/bats tests/integration.bats

workflows:
  version: 2
  build-and-test:
    jobs:
      - build-and-test
      - integration-tests-js:
          requires:
            - build-and-test
      - integration-tests-multi-user-simple:
          requires:
            - build-and-test
      - integration-tests-email-verification:
          requires:
            - build-and-test
