version: 2.1

# Scheduled pipelines (Project Settings → Triggers) set this true.
# In-config `triggers: schedule` is deprecated and does not show up under
# "Scheduled Pipelines"; on the GitHub-App project it also never reaches
# resource class `coasys/marvin` (legacy org `gh/coasys/ad4m` still fires
# the old trigger at 03:06 UTC and dies in ~1s with runner-org-unauthorized).
parameters:
  run-nightly-llm:
    type: boolean
    default: false
  # The WE branch, tag or full commit the nightly `coasys-spaces` job tests with this commit's
  # executor and SDK.
  we-ref:
    type: string
    default: dev

references:
  ad4m_image: &ad4m_image coasys/ad4m-ci-linux:latest@sha256:16a04358abc4b12ea4cf3a231cfdfea38ac6ae0cc4f937f6c0ed5d98dfb574e7

# Self-hosted machine runners on marvin (AMD Ryzen 9 9950X, 60GB RAM, Ubuntu 25.04), two pools:
# - coasys/marvin: every job that compiles Rust (build, clippy, rust-tests) and llm-e2e
#   (local Ollama). Few runners, each with a warm ~28GB target/ cache.
# - coasys/marvin-light: every job that compiles no Rust. These jobs restore the stashed
#   binaries (integration tests, CLI), run Node only (js-unit-tests, plugin) or only parse
#   Rust (fmt). More runners, with small working dirs.
# Only `build` gates the integration tests. clippy and rust-tests start after it and run
# next to the integration tests. fmt, js-unit-tests and plugin-ad4m-tests start at once.

commands:
  fix_workdir:
    description: "Recover from a corrupted or incomplete .git and stale local branches before checkout (#1325)"
    steps:
      - run:
          name: Fix corrupted working directory
          # Runs before `checkout` in every job. Each runner instance keeps one persistent
          # workdir, so the .git found here is whatever the previous job left behind.
          # scripts/ci-fix-workdir.test.sh extracts this block from the config and runs it
          # against scratch repositories; keep the step name and the `command: |` line as is.
          command: |
            heal() {
              echo "fix_workdir: $1 -- removing .git for a fresh clone"
              rm -rf .git
            }
            # `-e`, not `-d`: a .git file (a worktree gitlink) must be healed too, and rm -rf
            # removes a file as well. No runner workdir is a gitlink today.
            if [ -e .git ] && ! git rev-parse --git-dir >/dev/null 2>&1; then
              heal "corrupted .git (git rev-parse fails)"
            fi
            # A .git that opens but lacks objects its refs reach passes the check above and then
            # fails checkout with "pack has N unresolved deltas": checkout offers the local refs as
            # haves, GitHub sends a thin pack against them, and the bases are not there. A
            # connectivity check walks the same refs and finds the gap (0.3 s on a full clone,
            # about 3 s on a blob:none clone with 2000 promisor packs).
            # Some workdirs are blob:none partial clones. fsck accepts their missing blobs only
            # while the packs' .promisor marker files exist AND origin is still a promisor remote,
            # which any one of remote.origin.promisor, remote.origin.partialclonefilter or
            # extensions.partialClone makes it. Losing the first two (seen 2026-09-30) fails the
            # check with one "broken link" line per missing blob. Log that state with the fsck
            # output, so a broken pack can be told from lost partial-clone metadata afterwards.
            # The output goes through a here-string, not a pipe: under `bash -eo pipefail`,
            # `echo | head` dies of SIGPIPE once fsck prints more than a pipe buffer, which the
            # lost-metadata case does (megabytes), and the heal below would never run.
            if [ -e .git ]; then
              fsck_out="$(git fsck --connectivity-only --no-progress 2>&1)" || {
                echo "fix_workdir: git fsck --connectivity-only failed ($(wc -l \<<<"$fsck_out") lines, first 20):"
                head -20 \<<<"$fsck_out"
                echo "fix_workdir: partial-clone state:" \
                  "extensions.partialClone=$(git config --get extensions.partialClone || echo unset)" \
                  "remote.origin.promisor=$(git config --get remote.origin.promisor || echo unset)" \
                  "remote.origin.partialclonefilter=$(git config --get remote.origin.partialclonefilter || echo unset)" \
                  "promisor packs=$(ls .git/objects/pack/*.promisor 2>/dev/null | wc -l)"
                heal "missing objects reachable from refs"
              }
            fi
            # Stale local branches: checkout creates refs/heads/$CIRCLE_BRANCH and fails with
            # 'a branch named "refs/heads/<branch>" already exists' when an earlier job on the
            # same branch left it behind; the workdirs had 25-235 of them. Nothing else holds
            # these refs (one job per workdir, no linked worktrees), so drop them all in one
            # transaction; the fetched objects stay, so the next fetch is no larger. Detach HEAD
            # first: deleting the checked-out branch would otherwise leave the repo on an unborn
            # branch until checkout runs, and git log/status in a debugging session would show
            # an empty repo.
            # A branch checked out in a linked worktree is kept: deleting its ref would leave
            # that worktree on an unborn branch, and checkout -B would still fail with "already
            # used by worktree" (git checks the other worktree's HEAD, not the ref). None exist on
            # the runners today.
            if [ -e .git ]; then
              if head_sha="$(git rev-parse --verify -q HEAD)"; then
                git update-ref --no-deref HEAD "$head_sha"
              fi
              # Records after the first are the linked worktrees (the first is this one).
              held="$(git worktree list --porcelain | awk -v RS= 'NR > 1' | sed -n 's/^branch //p')"
              stale="$(git for-each-ref --format='%(refname)' refs/heads | grep -vxF -f <(printf '%s\n' $held /nonexistent) || true)"
              if [ -n "$stale" ]; then
                sed 's/^/delete /' \<<<"$stale" | git update-ref --stdin
                echo "fix_workdir: removed $(wc -l \<<<"$stale") stale local branch ref(s)"
              fi
              if [ -n "$held" ]; then
                echo "fix_workdir: kept branch(es) checked out in linked worktrees: $(tr '\n' ' ' \<<<"$held")"
              fi
            fi
            # Checkout refuses a non-empty directory that is not a repository, and these runners
            # keep untracked caches (target/, node_modules/) beside the checkout. An empty
            # repository with origin set lets checkout fetch everything and check out over the
            # old files, keeping the caches. (Ported from feat/embedded-sfu.)
            if [ ! -e .git ] && [ -n "$(ls -A)" ]; then
              echo "fix_workdir: files but no .git -- initialising an empty repository for checkout"
              git init -q
              git remote add origin "$CIRCLE_REPOSITORY_URL"
            fi
      - run:
          # tests/js/utils/utils.ts starts each executor in /tmp/ad4m-<hash>
          # and never deletes it. On marvin /tmp is a 30GB tmpfs shared by
          # every runner, and a busy hour leaves ~10GB. When it fills, Rust
          # tests fail with "No space left on device" and then en masse
          # with PoisonError (#1123, 2026-09-25). Skip dirs that a live
          # executor still uses; a concurrent job's dir is younger than 60 min.
          # WE's live harness (coasys-spaces) makes /tmp/we-live-web-<random> and
          # removes it when the suite ends; a killed run leaves it.
          name: Clean up stale test executor dirs in /tmp (older than 60 min)
          command: |
            in_use=$(pgrep -a -f 'ad4m-executor run' | grep -oE '/tmp/(ad4m-[0-9a-f]+|we-live-web-[A-Za-z0-9]+)' | sort -u || true)
            find /tmp -maxdepth 1 \( -name 'ad4m-*' -o -name 'we-live-web-*' \) -user "$(id -u)" -mmin +60 -print 2>/dev/null \
              | grep -vxF -f <(printf '%s\n' $in_use /nonexistent) \
              | xargs -r -d '\n' rm -rf || true
            df -h /tmp | tail -1

  setup_env:
    description: "Set up build environment (Node, Rust, Deno, Go, pnpm)"
    parameters:
      node_version:
        type: string
        default: "24"
    steps:
      - run:
          name: Setup build environment
          command: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" --no-use
            NODE_PATH=$(nvm which << parameters.node_version >> 2>/dev/null || true)
            if [ -z "$NODE_PATH" ] || [ ! -x "$NODE_PATH" ]; then
              echo "Node << parameters.node_version >> not found, installing via nvm..."
              nvm install << parameters.node_version >>
              NODE_PATH=$(nvm which << parameters.node_version >>)
            fi
            NODE_BIN_DIR=$(dirname "$NODE_PATH")
            echo "export PATH=\"$NODE_BIN_DIR:$HOME/.cargo/bin:$HOME/.deno/bin:$HOME/.local/go/bin:$HOME/.npm-global/bin:$HOME/.local/bin:$HOME/go/bin:$PATH\"" >> $BASH_ENV
            source $BASH_ENV
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "Rust: $(rustc --version)"
            # Only the language build (agent-language rust-impl) needs wasm-bindgen.
            # Skip the cargo install when it is already there: even a no-op
            # `cargo install` takes the shared ~/.cargo package-cache lock, which
            # every job on this host then queues on behind any running build.
            if wasm-bindgen --version 2>/dev/null | grep -q ' 0.2.118$'; then
              echo "wasm-bindgen 0.2.118 already installed"
            else
              echo "Installing wasm-bindgen-cli for Rust WASM builds..."
              cargo install wasm-bindgen-cli --version 0.2.118
            fi
            echo "Deno: $(deno --version | head -1)"
            echo "Go: $(go version)"
            echo "pnpm: $(pnpm --version || echo 'not installed yet')"

  build_adam:
    description: "Build the dapp, the Deno snapshot and the ADAM binaries (target/release/ad4m, ad4m-executor)"
    steps:
      - run:
          # Install per-workspace `hc` + `kitsune2-bootstrap-srv` matching
          # Cargo.lock. Needed before build_integration_inputs because the bootstrap-languages
          # build.sh files pack DNAs with `hc`, and downstream integration
          # tests spawn `kitsune2-bootstrap-srv`. Both must match what the
          # executor is linked against, otherwise packed bundles trip
          # `unknown field 'signal_url'` at install time and cross-node
          # signals never route between agents. The `build` job stashes the
          # binaries with the language bundles so the integration jobs do not
          # each build `hc` from source after a Holochain bump.
          name: Install pinned Holochain + kitsune2 CLIs (matches Cargo.lock)
          command: bash scripts/install-hc-toolchain.sh
          no_output_timeout: 30m
      - run:
          name: Install dependencies
          command: pnpm install --no-frozen-lockfile
      - run:
          name: Build dapp
          command: pnpm build-dapp
      - run:
          name: Install core dependencies
          command: cd ./core && pnpm install --no-frozen-lockfile
      - run:
          name: Remove stale binaries (self-hosted runner incremental cache)
          command: rm -f target/release/ad4m target/release/ad4m-executor
      - run:
          # Makes the Deno snapshot too: build-libs runs @coasys/rust-ad4m-executor#build
          # (`build-deno-snapshot`) before the cli builds the executor. The script
          # skips the snapshot when its inputs did not change since this workdir's
          # last build, or copies it from the host-wide cache in
          # $CI_ARTIFACT_DIR/deno-snapshot/ when another runner built those inputs.
          name: Build ADAM (without bootstrap languages)
          command: |
            export CI_ARTIFACT_DIR="${CI_ARTIFACT_DIR:-/var/lib/ci-artifacts}"
            pnpm run build-libs
          no_output_timeout: 30m
      - run:
          # The identity suite's tools: the integration runners compile no Rust.
          # One invocation with `ad4m`: the holder reaches the executor through rust-client,
          # whose TLS needs OpenSSL, and only `ad4m`'s graph vendors it (no system OpenSSL here).
          name: Build identity-store and the identity test holder
          command: |
            cargo build --release -p ad4m -p identity-store -p ad4m-identity-client \
              --bin identity-store --example holder \
              --features ad4m-identity-client/ws,ad4m-identity-client/test-vault
          no_output_timeout: 30m

  build_integration_inputs:
    description: "Build the bootstrap languages with the pinned hc (after build_adam)"
    steps:
      - run:
          # Same clear the integration jobs used to do before their own
          # language build: turbo's cache (.turbo/cache in turbo 2) does not
          # hash the `hc` binary, so a replayed cache entry could carry a happ
          # packed by a previous Holochain version.
          name: Clear stale bootstrap-language build cache (cross-branch shared workdir)
          command: |
            rm -rf .turbo bootstrap-languages/*/.turbo bootstrap-languages/*/build
      - run:
          # Built ONCE in `build` instead of in every integration job (Nico,
          # 2026-09-25); the integration jobs restore the outputs. Only the
          # nightly, which has no `build` job, runs this itself. Rollup
          # bundles + Holochain wasm DNAs packed with build_adam's pinned `hc`.
          name: Build bootstrap languages
          command: pnpm run build-languages
          no_output_timeout: 30m

  restore_binaries:
    description: "Restore the ad4m + ad4m-executor binaries that build stashed on this host"
    steps:
      - run:
          name: Restore binaries from local stash (no CircleCI network storage needed — same host)
          command: |
            # CI_ARTIFACT_DIR: env-driven so the shared self-hosted runner
            # can be re-imaged / re-owned without editing this file. Default
            # is a system-level path that does not couple this config to any
            # particular user account on the runner host. The runner must
            # `mkdir -p /var/lib/ci-artifacts && chown <ci-user> /var/lib/ci-artifacts`
            # once at install time. Long-term this should move to GitLab CI
            # (Nico's 2026-08-27 review); the /var/lib default is the short-term
            # de-marvin-ification step.
            set -eo pipefail
            CI_ARTIFACT_DIR="${CI_ARTIFACT_DIR:-/var/lib/ci-artifacts}"
            src="$CI_ARTIFACT_DIR/${CIRCLE_SHA1}"
            for bin in ad4m ad4m-executor identity-store holder; do
              test -s "$src/$bin" || { echo "missing $src/$bin: rerun build"; exit 1; }
            done
            mkdir -p target/release/examples
            # Remove before copy: unlinking avoids ETXTBSY if a previous executor still holds the binary
            rm -f target/release/ad4m target/release/ad4m-executor target/release/identity-store target/release/examples/holder
            cp "$src/ad4m" "$src/ad4m-executor" "$src/identity-store" target/release/
            cp "$src/holder" target/release/examples/holder

  restore_integration_inputs:
    description: "Restore the JS build outputs and hc toolchain that build produced (bootstrap languages, link-server, core, ALDK)"
    steps:
      - run:
          # `build` compiles the bootstrap languages (rollup + Holochain wasm
          # DNAs) once and stashes every gitignored output the integration
          # tests read; see "Stash integration inputs" in the build job for
          # the list. Restoring here replaces the per-job `pnpm run
          # build-languages`, which put ~8 parallel cargo/wasm builds per
          # pipeline on this one host and stalled for 10 min on the shared
          # ~/.cargo package-cache lock (PR #1156, 2026-09-25).
          name: Restore integration inputs from build
          command: |
            set -eo pipefail
            CI_ARTIFACT_DIR="${CI_ARTIFACT_DIR:-/var/lib/ci-artifacts}"
            src="$CI_ARTIFACT_DIR/${CIRCLE_SHA1}/integration-inputs.tar"
            test -s "$src" || { echo "missing $src: rerun build"; exit 1; }
            # Drop the previous branch's outputs first (cross-branch shared
            # workdir) so nothing stale survives next to this SHA's files.
            rm -rf .turbo bootstrap-languages/*/.turbo bootstrap-languages/*/build \
                   bootstrap-languages/local/dist ad4m-ldk/js/lib core/lib link-server/dist
            tar -xf "$src"
            echo "restored $(tar -tf "$src" | wc -l) entries from $src"
            ls -l bootstrap-languages/*/build/bundle.js bootstrap-languages/local/dist/docker_seed.json \
                  link-server/dist/index.js .hc-toolchain/bin/

  test_artifacts_dir:
    description: "Give this job an empty test-artifact directory, test-artifacts/ in the workdir, as $TEST_ARTIFACTS"
    steps:
      - run:
          # Not a shared /tmp dir: the runners on this host share /tmp, so concurrent jobs mixed
          # each other's mocha.log and logs, and old runs' files were stored again. The workdir
          # belongs to one runner instance, which runs one job at a time; emptying it here makes
          # it this job's. store_artifacts takes `path: test-artifacts` (relative to the workdir):
          # it does not expand environment variables.
          name: Create an empty test-artifact directory for this job
          command: |
            rm -rf test-artifacts
            mkdir -p test-artifacts
            echo "export TEST_ARTIFACTS=\"$PWD/test-artifacts\"" >> "$BASH_ENV"

  setup_integration_test_environment:
    description: "Setup integration test environment from build's stash (Holochain or local-only bootstrap languages)"
    parameters:
      local:
        # true: local-only bootstrap languages, no Holochain conductor (#918).
        # Both modes restore the same stash; they differ only in LOCAL_MODE,
        # which the test scripts read to pick the language set.
        type: boolean
        default: false
      build_binaries:
        description: >-
          Build ADAM and the integration inputs in this job instead of restoring
          the `build` job's stash. A scheduled pipeline has no `build` job, and
          `build` deletes stashes older than 12 hours, so the stash for the SHA
          may be gone.
        type: boolean
        default: false
    steps:
      - fix_workdir
      - checkout
      - test_artifacts_dir
      - when:
          condition: << parameters.local >>
          steps:
            - run:
                name: Set LOCAL_MODE for downstream test suites
                command: echo 'export LOCAL_MODE=true' >> "$BASH_ENV"
      - unless:
          condition: << parameters.build_binaries >>
          steps:
            - restore_binaries
      - setup_env
      - when:
          condition: << parameters.build_binaries >>
          steps:
            - build_adam
            - build_integration_inputs
      - run:
          name: Install dependencies
          command: pnpm install --no-frozen-lockfile
      - run:
          name: Install core dependencies
          command: cd ./core && pnpm install --no-frozen-lockfile
      - unless:
          condition: << parameters.build_binaries >>
          steps:
            - restore_integration_inputs
      - run:
          # core/lib itself comes from the tarball; this is the remaining
          # half of core's build script (`patch-package && tsc && bundle`),
          # which patches core/node_modules, not lib/.
          name: Apply core's patch-package patches
          command: cd ./core && pnpm exec patch-package
      - run:
          # Tests need `hc` (tests/js/scripts/prepareTestDirectory.sh symlinks
          # it into tst-tmp/, in local mode too) and `kitsune2-bootstrap-srv`
          # (spawned by tests/js/utils/utils.ts) at RUNTIME, so the toolchain
          # stays here. The binaries and the version stamps were just restored
          # from build's tarball, so this script only compares the stamps
          # against Cargo.lock and exits in well under a second; it rebuilds
          # only on drift.
          name: Verify pinned Holochain + kitsune2 CLIs (restored from build; matches Cargo.lock)
          command: bash scripts/install-hc-toolchain.sh
          no_output_timeout: 30m

  restore_rust_compile_inputs:
    description: "Restore the files build generated that the Rust compile embeds (deno snapshot, dapp)"
    steps:
      - run:
          name: Restore generated Rust compile inputs from build
          command: |
            set -eo pipefail
            CI_ARTIFACT_DIR="${CI_ARTIFACT_DIR:-/var/lib/ci-artifacts}"
            src="$CI_ARTIFACT_DIR/${CIRCLE_SHA1}/compile-inputs.tar"
            test -s "$src" || { echo "missing $src: rerun build"; exit 1; }
            rm -rf dapp/dist
            tar -xf "$src"

jobs:
  build:
    machine: true
    resource_class: coasys/marvin
    steps:
      - fix_workdir
      - checkout
      - setup_env
      - run:
          name: Clean up stale local artifact stashes (older than 12 hours)
          command: |
            CI_ARTIFACT_DIR="${CI_ARTIFACT_DIR:-/var/lib/ci-artifacts}"
            # deno-snapshot/ prunes its own entries by last use (build-deno-snapshot.sh);
            # its directory's mtime moves only when an entry is added or removed.
            find "$CI_ARTIFACT_DIR" -maxdepth 1 -mindepth 1 ! -name deno-snapshot -mmin +720 -exec rm -rf {} + 2>/dev/null || true
      - run:
          # Local git repo + fake cargo, no network; about a second.
          name: Test install-hc-toolchain.sh
          command: bash scripts/install-hc-toolchain.test.sh
      - run:
          # Scratch workdirs + fake cargo, no network; about a second. The snapshot's
          # stamp and the host-wide cache's digests (a kept workdir must not embed
          # another commit's snapshot).
          name: Test build-deno-snapshot.sh
          command: bash rust-executor/scripts/build-deno-snapshot.test.sh
      - run:
          # Scratch git repos, no network; about two seconds. Runs the fix_workdir
          # block above against healthy and deliberately broken workdirs (#1325).
          name: Test the fix_workdir step
          command: bash scripts/ci-fix-workdir.test.sh
      - run:
          # Fake executor, local git repo, local HTTP server; about a second. The nightly
          # coasys-spaces job's executor fetch, skip and model check.
          name: Test coasys-spaces.sh
          command: bash scripts/coasys-spaces.test.sh
      - build_adam
      - build_integration_inputs
      - run:
          # The newest glibc symbol the executor needs decides which Linux it runs on: one built
          # here needs at least the glibc of the machine that built it, as far as the symbols it
          # uses go. Printed so a binary meant for other machines can be checked against them
          # (Ubuntu 24.04 has 2.39, 22.04 has 2.35).
          name: Report the executor's glibc floor
          command: |
            if ! command -v objdump >/dev/null; then echo "objdump not installed"; exit 0; fi
            floor="$(objdump -T target/release/ad4m-executor | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
            echo "ad4m-executor needs ${floor:-no versioned glibc symbols}"
            echo "This machine: $(ldd --version | head -1)"
      - run:
          name: Stash binaries locally (skip CircleCI network storage — all jobs run on same host)
          command: |
            # Write to a temp name and rename: a rerun of build for the same
            # SHA must not hand a half-written file to an integration job
            # that is restoring from the earlier run (mv is atomic on one fs).
            CI_ARTIFACT_DIR="${CI_ARTIFACT_DIR:-/var/lib/ci-artifacts}"
            dst="$CI_ARTIFACT_DIR/${CIRCLE_SHA1}"
            mkdir -p "$dst"
            for bin in ad4m ad4m-executor identity-store examples/holder; do
              # `a && b` inside a loop does not stop the step under bash -e.
              name="$(basename "$bin")"
              cp "target/release/$bin" "$dst/$name.tmp" || exit 1
              mv "$dst/$name.tmp" "$dst/$name"
            done
      # The executor for this commit, for use outside this host. Written on the runner's
      # magnetic disk and served at https://executor.ad4m.dev/<commit>/manifest.json.
      # Not a CircleCI artifact: that storage is billed, and one file is about 90 MB per push.
      #
      # A consumer (coasys/we scripts/ad4m-executor-download.mjs) fetches the manifest, then the
      # file it names, and checks the sha256. The manifest schema is unchanged: commit, platform,
      # file, sha256, glibc, size. Directories older than 35 days are removed, which covers the
      # month a pkg.pr.new snapshot of the commit is kept. A missing file is a reason to compile.
      #
      # zstd -19: about 90 MB from 370, against 130 MB with gzip. Debug symbols are kept.
      # gzip only if zstd is missing, so a missing tool cannot fail the job every other job
      # waits on. The directory is swapped into place, so a reader sees the previous set or the
      # new set, never a mix (a mixed set fails the consumer's checksum instead of falling back).
      #
      # Linux x64 only. The binary needs the glibc the previous step reports.
      - run:
          name: Publish the executor on this host
          command: |
            set -euo pipefail
            root="${EXECUTOR_PUBLISH_DIR:-/mnt/hdd/executor-artifacts}"
            if ! printf '%s' "$CIRCLE_SHA1" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "refusing to publish: CIRCLE_SHA1 is not 40 hex"
              exit 1
            fi
            if [ ! -d "$root" ] || [ ! -w "$root" ]; then
              echo "publish dir $root is not writable"
              exit 1
            fi
            bin=target/release/ad4m-executor
            test -s "$bin"
            stage=$(mktemp -d "$root/.staging.XXXXXX")
            trap 'rm -rf "$stage"' EXIT
            if command -v zstd >/dev/null; then
              file=ad4m-executor.zst
              zstd -19 -T0 -q -c "$bin" > "$stage/$file"
            else
              echo "zstd not installed: falling back to gzip"
              file=ad4m-executor.gz
              gzip -6 -c "$bin" > "$stage/$file"
            fi
            (cd "$stage" && sha256sum "$file" > "$file.sha256")
            floor="$(objdump -T "$bin" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 || true)"
            printf '{\n  "commit": "%s",\n  "platform": "linux-x64",\n  "file": "%s",\n  "sha256": "%s",\n  "glibc": "%s",\n  "size": %s\n}\n' \
              "$CIRCLE_SHA1" "$file" "$(cut -d' ' -f1 "$stage/$file.sha256")" "${floor#GLIBC_}" \
              "$(stat -c %s "$bin")" > "$stage/manifest.json"
            dest="$root/$CIRCLE_SHA1"
            if [ -e "$dest" ]; then
              old=$(mktemp -d "$root/.old.XXXXXX")
              mv "$dest" "$old/prev"
              mv "$stage" "$dest"
              rm -rf "$old"
            else
              mv "$stage" "$dest"
            fi
            trap - EXIT
            # mktemp makes the directory 700. nginx reads it as www-data.
            chmod 755 "$dest"
            chmod 644 "$dest"/*
            find "$root" -mindepth 1 -maxdepth 1 -regextype posix-extended -regex '.*/[0-9a-f]{40}' -mtime +35 -exec rm -rf {} +
            find "$root" -mindepth 1 -maxdepth 1 \( -name '.staging.*' -o -name '.old.*' \) -mmin +60 -exec rm -rf {} +
            echo "published https://executor.ad4m.dev/$CIRCLE_SHA1/manifest.json"
            ls -l "$dest" && cat "$dest/manifest.json"
      - run:
          # clippy and rust-tests compile on other runners. These generated files are
          # embedded by that compile (include_bytes!/include!/include_dir!) and are
          # not in git. The stamp (.inputs) goes with the snapshot: the workdir
          # keeps what this restores. Without it, another commit's snapshot sat
          # under this workdir's old stamp, the next build there said "up to
          # date" and embedded it (deno panics: the snapshot's op count is not
          # the binary's). The stamp now also holds the outputs' digest, so
          # build-deno-snapshot.sh rebuilds such a mix anyway; with the stamp
          # restored too, a later build of this commit there needs no rebuild.
          name: Stash generated Rust compile inputs for clippy and rust-tests
          command: |
            CI_ARTIFACT_DIR="${CI_ARTIFACT_DIR:-/var/lib/ci-artifacts}"
            dst="$CI_ARTIFACT_DIR/${CIRCLE_SHA1}/compile-inputs.tar"
            tar -cf "$dst.tmp" \
              rust-executor/CUSTOM_DENO_SNAPSHOT.inputs \
              rust-executor/CUSTOM_DENO_SNAPSHOT.bin \
              rust-executor/CUSTOM_DENO_SNAPSHOT.residual_esm.rs \
              rust-executor/CUSTOM_DENO_SNAPSHOT.residual_js.rs \
              dapp/dist
            mv "$dst.tmp" "$dst"
      - run:
          # Everything gitignored that the integration jobs read and used to
          # rebuild themselves (restored by restore_integration_inputs):
          #   bootstrap-languages/*/build      esbuild/rollup bundles; tests copy
          #                                    build/bundle.js (get-builtin-test-langs.js)
          #   hc-dna/workdir/*.dna|*.happ      packed DNAs/hApps (dna.yaml/happ.yaml names)
          #   ad4m-ldk/js/lib                  ALDK, bundled into the languages
          #   core/lib                         @coasys/ad4m, linked from tests/js
          #   link-server/dist                 spawned by tests/js/utils/linkServer.ts
          #   .hc-toolchain/bin + stamps       `hc` and `kitsune2-bootstrap-srv`,
          #                                    needed at test runtime
          #   bootstrap-languages/local/dist   #918's local-language seed + bundles
          #                                    (generate-seed.mjs); the tests read
          #                                    local/*.js from git
          # A branch that adds a language output dir must add it to this list.
          name: Stash integration inputs (bootstrap languages, link-server, core, hc toolchain)
          command: |
            CI_ARTIFACT_DIR="${CI_ARTIFACT_DIR:-/var/lib/ci-artifacts}"
            dst="$CI_ARTIFACT_DIR/${CIRCLE_SHA1}/integration-inputs.tar"
            tar -cf "$dst.tmp" \
              bootstrap-languages/*/build \
              bootstrap-languages/local/dist \
              bootstrap-languages/*/hc-dna/workdir/*.dna \
              bootstrap-languages/*/hc-dna/workdir/*.happ \
              ad4m-ldk/js/lib \
              core/lib \
              link-server/dist \
              .hc-toolchain/bin/hc \
              .hc-toolchain/bin/kitsune2-bootstrap-srv \
              .hc-toolchain/.installed_rev \
              .hc-toolchain/.installed_kitsune_version
            mv "$dst.tmp" "$dst"
            ls -l "$CI_ARTIFACT_DIR/${CIRCLE_SHA1}/"

  # Clippy and the Rust tests outside rust-executor. They run here, beside rust-tests,
  # because rust-executor's single-threaded suite alone fills rust-tests; both jobs are
  # required checks. Each test step runs even if an earlier step failed.
  clippy:
    machine: true
    resource_class: coasys/marvin
    steps:
      - fix_workdir
      - checkout
      - setup_env
      - restore_rust_compile_inputs
      - run:
          name: cargo clippy
          no_output_timeout: 30m
          command: cargo clippy --all --exclude ad4m-launcher
      - run:
          # The cli and the identity client in one cargo run: the client's ws feature needs
          # OpenSSL, which only `ad4m`'s graph vendors, and one run builds `ad4m` once, with
          # one feature set. Testing them apart builds `ad4m` twice.
          name: cli and identity client tests
          when: always
          command: |
            cargo test --release -p ad4m -p ad4m-identity-client \
              --features ad4m-identity-client/ws,ad4m-identity-client/test-vault,ad4m-identity-client/store
          no_output_timeout: 30m
      - run:
          # The other identity crates: one run per crate, because each tests its own feature set.
          name: identity crates tests
          when: always
          command: |
            cargo test --release -p ad4m-hash-chain --all-features
            cargo test --release -p ad4m-identity-core --all-features
            cargo test --release -p identity-store
            cargo test --release -p ad4m-keyring
          no_output_timeout: 30m
      - run:
          # ad4m-hash-chain on wasm32 under Node: the shared vectors, the RFC 8785 data, the
          # text checks and the wasm-bindgen exports. ad4m-keyring's own tests on wasm32, where
          # its randomness is `crypto.getRandomValues`. The test runner must be the locked
          # wasm-bindgen version; it is installed once into the (persistent) target dir.
          name: identity crates wasm tests
          when: always
          command: |
            WASM_BINDGEN=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
            RUNNER=$PWD/target/wasm-tools/bin/wasm-bindgen-test-runner
            if ! "$RUNNER" --version 2>/dev/null | grep -q " $WASM_BINDGEN\$"; then
              cargo install wasm-bindgen-cli --version "$WASM_BINDGEN" --locked --root target/wasm-tools
            fi
            CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=$RUNNER \
              cargo test -p ad4m-hash-chain --target wasm32-unknown-unknown --features wasm
            CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=$RUNNER \
              cargo test --release -p ad4m-keyring --target wasm32-unknown-unknown
          no_output_timeout: 30m
      - run:
          # ad4m-ldk/rust is its own workspace, so the commands above skip it.
          name: ad4m-ldk (Rust) tests
          when: always
          command: cd ad4m-ldk/rust && cargo test
          no_output_timeout: 30m

  fmt:
    # rustfmt only parses the sources, so it needs no build and no warm target/.
    machine: true
    resource_class: coasys/marvin-light
    steps:
      - fix_workdir
      - checkout
      - setup_env
      - run:
          name: cargo fmt --check
          command: cargo fmt --check

  rust-tests:
    machine: true
    resource_class: coasys/marvin
    steps:
      - fix_workdir
      - checkout
      - setup_env
      - restore_rust_compile_inputs
      - run:
          # Unit tests, the crate's integration tests and doc-tests; the same command as
          # the crate's `pnpm test` script.
          name: rust-executor tests
          command: cd rust-executor && cargo test --release -- --test-threads=1
          no_output_timeout: 30m

  js-unit-tests:
    machine: true
    resource_class: coasys/marvin-light
    steps:
      - fix_workdir
      - checkout
      - setup_env
      - run:
          name: Install dependencies
          command: pnpm install --no-frozen-lockfile
      - run:
          name: Install core dependencies
          command: cd ./core && pnpm install --no-frozen-lockfile
      - run:
          name: Build core package
          command: cd ./core && pnpm run build
      - run:
          name: Remove pnpm patches
          command: node removePnpm.js
      - run:
          name: Install dependencies
          command: pnpm install --no-frozen-lockfile
      - run:
          name: Install core dependencies
          command: cd ./core && pnpm install --no-frozen-lockfile
      - run:
          # The root `pnpm test` minus the two cargo packages, which run in rust-tests.
          name: JS unit tests
          command: pnpm exec turbo run test --concurrency=1 --filter='!@coasys/rust-ad4m-executor' --filter='!@coasys/ad4m-cli'
          no_output_timeout: 30m
      - run:
          # The wind tunnel's pure parts (no model server), including the check that
          # ai-wind-tunnel/recommendations.json is what the checked-in evidence derives.
          name: AI wind tunnel unit tests
          command: cd ./tests/js && pnpm run test-ai-wind-tunnel-unit

  # The regular JS integration suite: local bootstrap languages only, no
  # Holochain conductor. Two-executor suites share languages, neighbourhoods
  # and agent profiles through the shared stores (tests/js/utils/sharedStores.ts).
  integration-tests-js:
    machine: true
    resource_class: coasys/marvin-light
    steps:
      - setup_integration_test_environment:
          local: true
      - run:
          name: Run JS integration tests (local languages, no Holochain)
          command: |
            mkdir -p "${TEST_ARTIFACTS:?}"
            set -o pipefail
            cd ./tests/js && pnpm run test-main-local 2>&1 | tee "$TEST_ARTIFACTS/mocha.log"
          no_output_timeout: 30m
      - run:
          name: Collect logs on failure
          when: always
          command: |
            mkdir -p "${TEST_ARTIFACTS:?}"
            shopt -s nullglob
            for ad4m_dir in tests/js/tst-tmp/agents/*/ad4m; do
              agent_id="$(basename "$(dirname "$ad4m_dir")")"
              mkdir -p "$TEST_ARTIFACTS/$agent_id"
              cp -r "$ad4m_dir/logs" "$TEST_ARTIFACTS/$agent_id/" 2>/dev/null || true
            done
            lsof -i -P -n 2>/dev/null | grep LISTEN > "$TEST_ARTIFACTS/listening-ports.txt" || true
      - store_artifacts:
          when: always
          path: test-artifacts
          destination: test-logs

  # SFU and mesh calls end to end through the SDK: managed users on one
  # executor, local languages (no Holochain). About 4 minutes. E6 shapes the
  # loopback with `tc` for its own ports only (runners share the host), and
  # skips where passwordless sudo is missing.
  integration-tests-sfu-e2e:
    machine: true
    resource_class: coasys/marvin
    steps:
      - setup_integration_test_environment:
          local: true
      - run:
          name: Run SFU end-to-end tests (local languages, no Holochain)
          command: |
            mkdir -p "${TEST_ARTIFACTS:?}"
            set -o pipefail
            cd ./tests/js && pnpm run test-main-sfu-e2e 2>&1 | tee "$TEST_ARTIFACTS/mocha.log"
          no_output_timeout: 20m
      - store_artifacts:
          when: always
          path: test-artifacts
          destination: test-logs

  # SFU and mesh calls in real Chromium, Firefox and WebKit, mixed, through the
  # SDK's browser build (tests/js/tests/sfu-browsers.test.ts). One executor,
  # local languages. Nightly against `dev`, in `nightly-llm-e2e`, with the SFU
  # wind tunnel: it is the only check that a browser other than Chromium can
  # call (#1684 broke Firefox on the SFU while every Chromium-based suite stayed
  # green). It builds its own binaries: that pipeline has no `build` job.
  # The runner is Ubuntu 25.04, which Playwright has no builds for: it falls back
  # to the 24.04 builds, whose WebKit needs ICU 74 and ffmpeg 6, absent on 25.04.
  # Debian 13's builds use the same ICU (76) and ffmpeg (7) as 25.04, so the job
  # takes those, in their own browsers path so they never mix with the 24.04
  # builds other jobs on the runner use. The path persists on the runner, so the
  # install is a download only when playwright-core's version changes.
  # `SFU_BROWSERS_REQUIRED` makes a browser that cannot start fail the job
  # instead of skipping its tests.
  integration-tests-sfu-browsers:
    machine: true
    resource_class: coasys/marvin
    environment:
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: debian13-x64
      PLAYWRIGHT_BROWSERS_PATH: /home/marvin/.cache/ms-playwright-debian13
    steps:
      - setup_integration_test_environment:
          local: true
          build_binaries: true
      - run:
          name: Install Chromium, Firefox and WebKit
          command: |
            cd ./tests/js
            # The install's own host check knows no 25.04 package names, so it is skipped
            # here; the script installs the libraries, and the launch checks them again.
            PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS=1 pnpm exec playwright-core install chromium firefox webkit
            sudo apt-get update -qq
            ./scripts/install-browser-deps.sh
      - run:
          name: Run cross-browser SFU and mesh call tests
          command: |
            mkdir -p "${TEST_ARTIFACTS:?}"
            set -o pipefail
            cd ./tests/js && SFU_BROWSERS_REQUIRED=1 pnpm run test-main-sfu-browsers 2>&1 | tee "$TEST_ARTIFACTS/mocha.log"
          no_output_timeout: 20m
      - store_artifacts:
          when: always
          path: test-artifacts
          destination: test-logs

  # Multi-node suite over the server-link-language: Alice + Bob on local
  # languages (no Holochain), links syncing through a link-server the suite
  # starts (tests/js/tests/integration-server-link.test.ts).
  integration-tests-multi-node-server-link:
    machine: true
    resource_class: coasys/marvin-light
    steps:
      - setup_integration_test_environment:
          local: true
      - run:
          # link-server/dist comes from build's stash (build-libs builds it);
          # this only installs the native better-sqlite3 module its runtime needs.
          name: Install link-server dependencies
          command: pnpm --filter @coasys/link-server install
      - run:
          name: Run multi-node server-link integration tests (Alice + Bob, no Holochain)
          command: |
            mkdir -p "${TEST_ARTIFACTS:?}"
            set -o pipefail
            cd ./tests/js && pnpm run test-main-server-link 2>&1 | tee "$TEST_ARTIFACTS/mocha.log"
          no_output_timeout: 30m
      - run:
          name: Collect logs on failure
          when: always
          command: |
            mkdir -p "${TEST_ARTIFACTS:?}"
            shopt -s nullglob
            for ad4m_dir in tests/js/tst-tmp/agents/*/ad4m; do
              agent_id="$(basename "$(dirname "$ad4m_dir")")"
              mkdir -p "$TEST_ARTIFACTS/$agent_id"
              cp -r "$ad4m_dir/logs" "$TEST_ARTIFACTS/$agent_id/" 2>/dev/null || true
            done
            lsof -i -P -n 2>/dev/null | grep LISTEN > "$TEST_ARTIFACTS/listening-ports.txt" || true
      - store_artifacts:
          when: always
          path: test-artifacts
          destination: test-logs

  # Identity end to end: a real identity-store and three executors (create, link,
  # first-link refusal, revoke, a store restored behind the cache, cache after restart).
  # No Holochain. The suite builds identity-store and the holder example with cargo.
  integration-tests-identity:
    machine: true
    resource_class: coasys/marvin-light
    steps:
      - setup_integration_test_environment:
          local: true
      - run:
          name: Run identity integration tests (identity-store, three executors)
          command: |
            mkdir -p "${TEST_ARTIFACTS:?}"
            set -o pipefail
            cd ./tests/js && pnpm run test-main-identity 2>&1 | tee "$TEST_ARTIFACTS/mocha.log"
          no_output_timeout: 30m
      - run:
          name: Collect logs on failure
          when: always
          command: |
            mkdir -p "${TEST_ARTIFACTS:?}"
            shopt -s nullglob
            for ad4m_dir in tests/js/tst-tmp/agents/*/ad4m; do
              agent_id="$(basename "$(dirname "$ad4m_dir")")"
              mkdir -p "$TEST_ARTIFACTS/$agent_id"
              cp -r "$ad4m_dir/logs" "$TEST_ARTIFACTS/$agent_id/" 2>/dev/null || true
            done
      - store_artifacts:
          when: always
          path: test-artifacts
          destination: test-logs

  # Multi-node suites that need Holochain: links syncing between executors
  # through p-diff-sync (tests/js/tests/integration.test.ts).
  integration-tests-multi-node-holochain:
    machine: true
    resource_class: coasys/marvin-light
    steps:
      - setup_integration_test_environment
      - run:
          name: Run multi-node Holochain integration tests (Alice + Bob)
          command: |
            mkdir -p "${TEST_ARTIFACTS:?}"
            set -o pipefail
            cd ./tests/js && pnpm run test-main-multi-node-holochain 2>&1 | tee "$TEST_ARTIFACTS/mocha.log"
          no_output_timeout: 30m
      - run:
          name: Collect logs on failure
          when: always
          command: |
            mkdir -p "${TEST_ARTIFACTS:?}"
            shopt -s nullglob
            for ad4m_dir in tests/js/tst-tmp/agents/*/ad4m; do
              agent_id="$(basename "$(dirname "$ad4m_dir")")"
              mkdir -p "$TEST_ARTIFACTS/$agent_id"
              cp -r "$ad4m_dir/logs" "$TEST_ARTIFACTS/$agent_id/" 2>/dev/null || true
              cp -r "$ad4m_dir/holochain" "$TEST_ARTIFACTS/$agent_id/" 2>/dev/null || true
            done
            lsof -i -P -n 2>/dev/null | grep LISTEN > "$TEST_ARTIFACTS/listening-ports.txt" || true
      - store_artifacts:
          when: always
          path: test-artifacts
          destination: test-logs

  integration-tests-multi-user-simple:
    machine: true
    resource_class: coasys/marvin-light
    steps:
      - setup_integration_test_environment
      - run:
          name: Run multi-user-simple integration tests
          command: cd ./tests/js && ./test-multi-user-with-setup.sh
          no_output_timeout: 30m

  integration-tests-email-verification:
    machine: true
    resource_class: coasys/marvin-light
    steps:
      - setup_integration_test_environment:
          local: true
      - run:
          name: Run email-verification integration tests (local)
          command: cd ./tests/js && ./email-verification-test-with-setup.sh --local
          no_output_timeout: 30m

  integration-tests-mcp:
    machine: true
    resource_class: coasys/marvin-light
    steps:
      - setup_integration_test_environment:
          local: true
      - run:
          name: Run MCP integration tests (local)
          command: cd ./tests/js && pnpm install && pnpm run test-mcp
          no_output_timeout: 30m

  integration-tests-model:
    machine: true
    resource_class: coasys/marvin-light
    steps:
      - setup_integration_test_environment:
          local: true
      - run:
          name: Run Ad4mModel unit + integration tests (local)
          command: cd ./tests/js && pnpm run test-model
          no_output_timeout: 30m
      - run:
          name: Run flow integration tests
          command: cd ./tests/js && pnpm run test-flow
          no_output_timeout: 30m

  # Runs everything gated by #[ignore = "llm-e2e"] (Rust) or LLM_E2E=1 (JS).
  # These hit Marvin's local Ollama; too slow + occasionally flaky for
  # per-push CI, so they run once nightly against `dev` via a scheduled
  # pipeline (`run-nightly-llm: true`).
  #
  # The exception is `anthropic_e2e`, which calls api.anthropic.com and
  # costs real money on every run. It reads `ANTHROPIC_API_KEY`
  # from the `nightly-llm-e2e` context and skips each test when the key is
  # unset, so it is inert until the key is added there.
  llm-e2e:
    machine: true
    resource_class: coasys/marvin
    steps:
      # Skip-if-unchanged: only run the expensive suite when dev has moved
      # since the last successful nightly. `circleci-agent step halt` ends
      # the job cleanly (green) so the workflow shows no wasted GPU cycles
      # on quiet days. `CIRCLECI_API_TOKEN` comes from the `nightly-llm-e2e`
      # context — set once via the API, org-scoped, read-only calls only.
      #
      # The lookup reads v1.1 `tree/dev`: one row per job, newest first, with
      # `vcs_revision`. (v2 `insights/.../jobs` returns per-job-name metrics
      # without a status or SHA, so a check built on it never halts.) Any API
      # failure leaves LAST_SHA empty, and the suite runs.
      - checkout
      - run:
          name: Skip if dev SHA unchanged since last successful llm-e2e
          command: |
            LAST_SHA=$(curl -sfL -H "Circle-Token: $CIRCLECI_API_TOKEN" \
              "https://circleci.com/api/v1.1/project/circleci/VRkXSnZDyBKHhkHKBHTmLj/W84Q4MGGTeZwizersNwxB4/tree/dev?filter=successful&limit=100&shallow=true" \
              | jq -r 'if type == "array" then first(.[] | select(.workflows.job_name? == "llm-e2e") | .vcs_revision) // "" else "" end') \
              || LAST_SHA=""
            if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "$CIRCLE_SHA1" ]; then
              echo "dev @ $CIRCLE_SHA1 already tested by last nightly — halting"
              circleci-agent step halt
              exit 0
            fi
            if [ -z "$LAST_SHA" ]; then
              echo "no previous successful llm-e2e run found — proceeding"
            else
              echo "dev @ $CIRCLE_SHA1, last tested $LAST_SHA — proceeding"
            fi
      # Build here: this pipeline has no `build` job, and the stash of an
      # older `build` for this SHA may already be deleted.
      - setup_integration_test_environment:
          build_binaries: true
      - run:
          name: Rust LLM-E2E (interpretation + harness + flow-context suites)
          command: |
            cd rust-executor && cargo test --release --lib -- \
              perspectives::interpretation_e2e \
              perspectives::interpretation_harness_e2e \
              perspectives::flow_context::real_llm_e2e \
              ai_service::providers::anthropic_e2e \
              --ignored --test-threads=1 --nocapture
          no_output_timeout: 60m
      - run:
          name: JS LLM-E2E (auto-processor + interpretation suites)
          command: |
            cd ./tests/js && LLM_E2E=1 pnpm run test-model
          no_output_timeout: 60m
      - run:
          name: JS LLM-E2E (integration — includes auto-processor-neighbourhood)
          # The wrapper runs prepare-test first, as the per-push
          # integration-tests-multi-node-holochain job does. Bare
          # `test-integration` needs the publishing agent in tst-tmp/.
          command: |
            cd ./tests/js && LLM_E2E=1 pnpm run test-main-multi-node-holochain
          no_output_timeout: 60m

  # Wind tunnel across executors: cascade, the two-executor session (T21)
  # and network baselines, over Holochain. Several scenarios sleep on
  # purpose (30s media/RTT, 35s TTL). That is a nightly measurement, not a
  # merge check, so this job is only in `nightly-llm-e2e`; the single-executor
  # calls run on every push in `integration-tests-sfu-e2e`. It builds its own
  # binaries: that pipeline has no `build` job, and `build` deletes stashes
  # older than 12 hours.
  integration-tests-sfu:
    machine: true
    resource_class: coasys/marvin
    steps:
      - setup_integration_test_environment:
          build_binaries: true
      - run:
          # T21 runs calls in real neighbourhoods, so it needs the test languages published.
          name: Prepare the test languages
          command: cd ./tests/js && pnpm run prepare-test
      - run:
          name: Run SFU wind tunnel tests
          command: cd ./tests/js && pnpm run test-sfu
          no_output_timeout: 30m
      - run:
          name: Collect logs on failure
          when: on_fail
          command: |
            mkdir -p "${TEST_ARTIFACTS:?}"
            cp -r /tmp/ad4m-sfu-test-* "$TEST_ARTIFACTS/" 2>/dev/null || true
      - store_artifacts:
          when: on_fail
          path: test-artifacts
          destination: sfu-test-logs

  # The Coasys product path in WE, end to end, on this commit: a space, a call, its
  # transcript, extraction into the social DNA's classes, and the flows on what was found
  # (WE apps/we-web/tests/live/coasys-spaces/, `test:spaces`). The suite lives in WE because
  # it drives WE's UI; this job runs it with this commit's executor and SDK, so the client
  # and the executor are one commit and a failure has one owner. WE comes from the `we-ref`
  # parameter (default dev). Nightly only, in `nightly-llm-e2e`.
  #
  # The shell steps are in scripts/coasys-spaces.sh, which also runs by hand (`all`):
  # - the executor published on this host for the commit (the `build` job's publish step),
  #   checked against its manifest; a build only when there is none;
  # - core and connect built and packed, and WE's ad4m pin (root pnpm.overrides) pointed at
  #   the two tarballs; WE installs with its own pnpm (its packageManager, pnpm 10);
  # - we-web built with WE_SEED=seeds/coasys.seed.json, then `test:spaces` in the real tier:
  #   Whisper in the executor, extraction on the host's Ollama.
  # It halts green when this ad4m commit and the WE commit `we-ref` names already passed
  # here: the pipeline fires several times a night, and WE moves on its own, so either repo
  # moving runs it again. The record is a file on the runner host (no API token).
  # Playwright's Chromium: the debian13 builds and browsers path of integration-tests-sfu-browsers.
  coasys-spaces:
    machine: true
    resource_class: coasys/marvin
    environment:
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: debian13-x64
      PLAYWRIGHT_BROWSERS_PATH: /home/marvin/.cache/ms-playwright-debian13
      WE_REF: << pipeline.parameters.we-ref >>
      COASYS_SPACES_TIER: real
      COASYS_SPACES_LLM_BASE_URL: http://localhost:11434/v1
      # The model staging and llm-e2e use, which Marvin keeps loaded: one load on the GPU.
      COASYS_SPACES_LLM_MODEL: qwen3.8-27b-48k
      # Its own directory, which preflight empties; one coasys-spaces runs at a time (serial
      # group nightly-llm).
      COASYS_SPACES_ARTIFACTS: /tmp/coasys-spaces-artifacts
    steps:
      - fix_workdir
      - checkout
      - setup_env
      - run:
          name: Skip if this ad4m commit and this WE commit already passed
          command: |
            rc=0
            bash scripts/coasys-spaces.sh preflight || rc=$?
            if [ "$rc" = 10 ]; then
              circleci-agent step halt
              exit 0
            fi
            exit "$rc"
      - run:
          # Before any build: a missing model fails in seconds, with what to do.
          name: Check that Ollama answers and has the model
          command: bash scripts/coasys-spaces.sh llm-check
      - run:
          name: Get the executor for this commit (published, else build)
          command: bash scripts/coasys-spaces.sh executor
          no_output_timeout: 30m
      - run:
          name: Build and pack core and connect
          command: bash scripts/coasys-spaces.sh sdk
          no_output_timeout: 20m
      - run:
          name: Clone WE at we-ref and install it with this commit's SDK
          command: bash scripts/coasys-spaces.sh we
          no_output_timeout: 20m
      - run:
          # Usually a no-op: integration-tests-sfu-browsers installs the same libraries nightly.
          name: Install Chromium's system libraries
          command: |
            sudo apt-get update -qq
            ./tests/js/scripts/install-browser-deps.sh
      - run:
          name: Build we-web with the Coasys seed
          command: bash scripts/coasys-spaces.sh build-web
          no_output_timeout: 20m
      - run:
          name: Run the coasys-spaces suite (WE test:spaces)
          command: bash scripts/coasys-spaces.sh test
          no_output_timeout: 60m
      - run:
          name: Record this commit pair as passed
          command: bash scripts/coasys-spaces.sh record
      - store_artifacts:
          when: always
          path: /tmp/coasys-spaces-artifacts
          destination: coasys-spaces

  integration-tests-cli:
    machine: true
    resource_class: coasys/marvin-light
    steps:
      - fix_workdir
      - checkout
      - restore_binaries
      - setup_env
      - run:
          name: git submodule
          command: git submodule update --init --recursive
      - run:
          name: Run binaries test script
          command: ./tests/bats/bin/bats tests/binaries.bats
      - run:
          name: Run integration test script
          command: ./tests/bats/bin/bats tests/integration.bats

  plugin-ad4m-tests:
    machine: true
    resource_class: coasys/marvin-light
    steps:
      - fix_workdir
      - checkout
      - run:
          name: Install dependencies
          working_directory: plugins/ad4m
          command: npm install
      - run:
          name: Run tests
          working_directory: plugins/ad4m
          command: npm test

  deploy-scripts:
    # Checks the shell scripts in deploy/staging and the release's checksum
    # script on every pipeline (about 20 s, no build needed), in these steps:
    #
    # 1. shellcheck, a static linter for shell scripts. It parses the script
    #    without running it and reports the classic shell bugs: unquoted
    #    variables that split on spaces or glob, `$?` or `$!` read after the
    #    wrong command, conditions that are always true or false, commands
    #    whose exit status is silently lost (`local x=$(cmd)`, `cmd | while`
    #    subshells), misuse of `[ ]` and `[[ ]]`, bashisms under `sh`, and
    #    variables that are set but never read. These are mistakes that only
    #    show up on the branch of the script that happens to run, so a linter
    #    catches them before a real deploy or rollback does. The binary is a
    #    pinned release (v0.10.0) checked against its SHA-256, so a new
    #    release cannot change what this job accepts, and a replaced download
    #    fails the checksum instead of running. Nothing here depends on what
    #    the runner has installed.
    #
    # 2. deploy/staging/test/update.test.sh runs update.sh itself against a
    #    throwaway git remote, with the build (pnpm, cargo) and systemd
    #    (systemctl, plus curl, node, sleep, cp, mv, jq) replaced by stubs, and
    #    checks every decision it makes: wait, deploy, skip, roll back a
    #    build that fails its check, keep a failed commit out, recover from a
    #    failed step after the stop, ignore a tag named like the branch, start
    #    nothing when a restore fails, clean up after a deploy or rollback
    #    killed half-way, and refuse a rollback by hand over any of these.
    #    This is worth running in CI because update.sh only ever runs on the
    #    staging host, started by its timer: without the test, its failure
    #    and rollback paths would only be exercised by a real failed deploy,
    #    and a bug there is what turns a failed deploy into a node that stays
    #    down. The stubs make the whole run take seconds and touch nothing
    #    outside a temp dir.
    #
    # 3. scripts/release-checksum.test.sh checks the SHA-256 line that the
    #    release workflows publish beside each executor binary.
    machine: true
    resource_class: coasys/marvin-light
    steps:
      - fix_workdir
      - checkout
      - run:
          name: shellcheck deploy/staging
          command: |
            # Pinned release, verified by SHA-256 (see the job comment above).
            dir=$(mktemp -d)
            curl -fsSL -o "$dir/shellcheck.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
            echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  $dir/shellcheck.tar.xz" | sha256sum -c -
            tar -xJf "$dir/shellcheck.tar.xz" -C "$dir"
            # -x follows `source`d files, so a sourced helper is checked too.
            "$dir/shellcheck-v0.10.0/shellcheck" -x deploy/staging/update.sh deploy/staging/test/update.test.sh \
              scripts/release-checksum.sh scripts/release-checksum.test.sh
            # The image's AI endpoints from the environment (sourced by docker-entrypoint.sh).
            "$dir/shellcheck-v0.10.0/shellcheck" -x -s bash docker/ai-env.sh docker/ai-env.test.sh
            rm -rf "$dir"
      - run:
          name: update.sh test
          # Stubbed build and systemd; see the job comment above.
          command: deploy/staging/test/update.test.sh
      - run:
          # The `.sha256` line the release workflows publish beside each executor binary
          # checks a download with `sha256sum -c` and refuses an altered one. No network.
          name: release-checksum.sh test
          command: bash scripts/release-checksum.test.sh
      - run:
          name: docker AI env test
          # docker/ai-env.sh against a fake executor: the AD4M_AI_* variables register
          # the endpoints, models and defaults they name, once.
          command: bash docker/ai-env.test.sh

workflows:
  version: 2
  build-and-test:
    when:
      not: << pipeline.parameters.run-nightly-llm >>
    jobs:
      - build
      - plugin-ad4m-tests
      - deploy-scripts
      - js-unit-tests
      - fmt
      - clippy:
          requires:
            - build
      - rust-tests:
          requires:
            - build
      - integration-tests-js:
          requires:
            - build
      - integration-tests-sfu-e2e:
          requires:
            - build
      - integration-tests-multi-node-server-link:
          requires:
            - build
      - integration-tests-identity:
          requires:
            - build
      - integration-tests-multi-node-holochain:
          requires:
            - build
      - integration-tests-multi-user-simple:
          requires:
            - build
      - integration-tests-email-verification:
          requires:
            - build
      - integration-tests-mcp:
          requires:
            - build
      - integration-tests-model:
          requires:
            - build

  # Nightly against `dev`. An API trigger (or a Project Trigger) sets
  # `run-nightly-llm`. In-config cron does not reach this project.
  # Same resource class (Marvin) so Ollama is local. llm-e2e, the SFU
  # wind tunnel and coasys-spaces start together and do not build on each
  # other's result: an llm-e2e failure must not skip the tunnel, and a tunnel
  # failure must not skip llm-e2e. Three API triggers fire this pipeline every night on
  # one host. Each job has its own serial group, so a second trigger waits
  # instead of sharing ports, DIDs and the GPU with the first. llm-e2e and
  # coasys-spaces share one group: both run models on the host's Ollama and
  # GPU, and together they make extraction timeouts likelier.
  nightly-llm-e2e:
    when: << pipeline.parameters.run-nightly-llm >>
    jobs:
      - llm-e2e:
          # Provides `CIRCLECI_API_TOKEN` for the skip-if-unchanged preflight.
          context:
            - nightly-llm-e2e
          serial-group: << pipeline.project.slug >>/nightly-llm
      - integration-tests-sfu:
          serial-group: << pipeline.project.slug >>/nightly-sfu
      - integration-tests-sfu-browsers:
          serial-group: << pipeline.project.slug >>/nightly-sfu-browsers
      - coasys-spaces:
          serial-group: << pipeline.project.slug >>/nightly-llm
