[package]
name = "perspective-diff-algorithm"
version = "0.1.0"
edition = "2021"
authors = ["josh@junto.foundation", "Nicolas Luck <nicolas.luck@coasys.org>"]
description = "Substrate-agnostic perspective-diff DAG algorithm (extracted from p-diff-sync)"
license = "CAL-1.0"

[lib]
name = "perspective_diff_algorithm"
path = "src/lib.rs"

[dependencies]
# default-features = false avoids chrono's `wasmbind` feature, which would
# pull wasm-bindgen into the perspective_diff_sync_integrity DNA WASM and
# cause Holochain to refuse to install it (unknown import
# `__wbindgen_placeholder__::__wbindgen_describe`). Matches the
# hc-dna zome's chrono config so Cargo unifies on the same feature set.
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "oldtime", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
petgraph = "0.6"

[dev-dependencies]
once_cell = "1"
