[package]
name = "test-wasm-language"
version = "0.1.0"
edition = "2021"
description = "Test WASM language using the new AD4M flat interface"

# Standalone — not part of main workspace
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true