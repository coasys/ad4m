[package]
name = "ad4m-wasm-language-sdk"
version = "0.1.0"
edition = "2021"
authors = ["AD4M Contributors"]
description = "SDK for building AD4M language modules as WASM"
license = "CAL-1.0"
repository = "https://github.com/coasys/ad4m"

[lib]
crate-type = ["lib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
