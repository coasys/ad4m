[package]
name = "ad4m-identity-core"
version = "0.1.0"
edition = "2021"
description = "The did:scid:coasys:1 identity core: the key event log as a chain type on ad4m-hash-chain, the SCID, signing domains, the proof of work and the 12 words"
license = "CAL-1.0"
homepage = "https://ad4m.dev"
repository = "https://github.com/coasys/ad4m"
publish = false

[features]
default = []
# Event builders: unsigned events, their signing inputs, attaching proofs, and the `Signer` trait.
build = []
# The 12 words (BIP-39), master key n (SLIP-0010 Ed25519), the next-key commitment and its salt,
# and the private record's recovery key. Only the identity client enables it, never a node.
words = [
    "dep:bip39",
    "dep:hmac",
    "dep:hkdf",
    "dep:zeroize",
    "dep:x25519-dalek",
    "dep:rand_core",
    "dep:getrandom",
]
# wasm-bindgen exports: the `KelChain` class with `fold` and `import`.
wasm = ["dep:wasm-bindgen", "dep:js-sys"]

[dependencies]
ad4m-hash-chain = { path = "../ad4m-hash-chain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
bs58 = "0.5.1"
ed25519-dalek = "2.2.0"
thiserror = "2.0.12"
bip39 = { version = "3.0.0", default-features = false, features = ["alloc", "zeroize"], optional = true }
hmac = { version = "0.12.1", optional = true }
hkdf = { version = "0.12.4", optional = true }
zeroize = { version = "1.8", optional = true }
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"], optional = true }
rand_core = { version = "0.6.4", features = ["getrandom"], optional = true }
wasm-bindgen = { version = "0.2.127", optional = true }
js-sys = { version = "0.3.104", optional = true }

# `words::generate` draws its entropy from the browser's or Node's crypto on wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.11.0"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
js-sys = "0.3.104"
wasm-bindgen = "0.2.127"
