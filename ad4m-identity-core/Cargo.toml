[package]
name = "ad4m-identity-core"
version = "0.1.0"
edition = "2021"
description = "The did:scid:coasys:1 identity core: the key event log as a chain type on ad4m-hash-chain, the SCID, signing domains, the proof of work and the 12 words"
license = "CAL-1.0"
homepage = "https://ad4m.dev"
repository = "https://github.com/coasys/ad4m"
publish = false

[features]
default = []
# Event builders: unsigned events, their signing inputs, attaching proofs, and the `Signer` trait.
build = []
# The 12 words (BIP-39), master key n (SLIP-0010 Ed25519), the next-key commitment and its salt,
# and the private record's recovery key. Only the identity client enables it, never a node.
words = [
    "dep:bip39",
    "dep:hmac",
    "dep:hkdf",
    "rand_core/getrandom",
]
# `fold_stored`: the replay of a host's own stored, already-verified log, without the signature
# checks. Only the identity store enables it; never a client, an executor or a wallet.
stored-fold = []
# wasm-bindgen exports: the `KelChain` class with `fold` and `import`, and `KelHandle.didDocument`.
wasm = ["dep:wasm-bindgen", "dep:js-sys"]
# `ts_rs::TS` on the link verdict types, for the executor's generated SDK types.
ts = ["dep:ts-rs"]

[dependencies]
ad4m-hash-chain = { path = "../ad4m-hash-chain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
bs58 = "0.5.1"
ed25519-dalek = "2.2.0"
thiserror = "2.0.12"
# The RFC 3339 timestamp of a link's old signed bytes (`judgement::hash_data_and_timestamp`).
# Parsing and formatting only: no clock.
chrono = { version = "0.4.38", default-features = false, features = ["alloc"] }
ts-rs = { version = "12.0.1", optional = true }
bip39 = { version = "3.0.0", default-features = false, features = ["alloc", "zeroize"], optional = true }
hmac = { version = "0.12.1", optional = true }
hkdf = { version = "0.12.4", optional = true }
# Secrets held in memory (the words, the seed, a record key, a master key from the inbox).
zeroize = "1.8"
# The device inbox and the private record: HPKE (RFC 9180) base mode with DHKEM(X25519,
# HKDF-SHA256), HKDF-SHA256 and ChaCha20-Poly1305; the record itself under XChaCha20-Poly1305.
# hpke 0.12 is the line on rand_core 0.6, like the rest of the workspace. The caller passes the
# RNG (the core draws no randomness of its own outside `words::generate`).
hpke = { version = "0.12.0", default-features = false, features = ["alloc", "x25519"] }
chacha20poly1305 = "0.10.1"
base64 = "0.22.1"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
rand_core = "0.6.4"
wasm-bindgen = { version = "0.2.127", optional = true }
js-sys = { version = "0.3.104", optional = true }

# getrandom's backend on wasm32: the browser's or Node's crypto. `words::generate` draws from it;
# and hpke's AEAD crates turn on `aead/getrandom`, so getrandom is in every wasm32 build and needs
# a backend even where nothing calls it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.11.0"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
js-sys = "0.3.104"
wasm-bindgen = "0.2.127"
