# Agent Language Tests - Using CircleCI Docker Image

name: Agent Language

on:
  push:
    branches:
      - main
      - staging
      - bootstrap-languages

jobs:
  rust-tests:
    name: Rust Tests (Unit + Integration)
    runs-on: ubuntu-22.04
    container:
      image: coasys/ad4m-ci-linux:latest@sha256:16a04358abc4b12ea4cf3a231cfdfea38ac6ae0cc4f937f6c0ed5d98dfb574e7

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            bootstrap-languages/agent-language/hc-dna/target/
          key: ${{ runner.os }}-agent-language-rust-${{ hashFiles('bootstrap-languages/agent-language/hc-dna/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-agent-language-rust-

      - name: Build DNA
        working-directory: bootstrap-languages/agent-language/hc-dna
        run: bash build.sh

      - name: Run unit tests
        working-directory: bootstrap-languages/agent-language/hc-dna
        run: cargo test --lib -- --test-threads=1

      - name: Run sweettest integration tests
        working-directory: bootstrap-languages/agent-language/hc-dna/tests/sweettest
        run: cargo test --test integration

      - name: Save Rust cache
        if: success()
        uses: actions/cache/save@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            bootstrap-languages/agent-language/hc-dna/target/
          key: ${{ runner.os }}-agent-language-rust-${{ hashFiles('bootstrap-languages/agent-language/hc-dna/Cargo.lock') }}
