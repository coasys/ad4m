name: Exploration CI

on:
  push:
    branches:
      - feat/wasm-language-runtime
      - feat/sqlite-link-storage
  pull_request:
    branches: [dev]

jobs:
  cargo-check:
    name: Cargo Check
    runs-on: ubuntu-22.04
    container:
      image: coasys/ad4m-ci-linux:latest@sha256:3d6e8b6357224d689345eebd5f9da49ee5fd494b3fd976273d0cf5528f6903ab
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-executor
          cache-on-failure: true

      - name: Check default features (SurrealDB)
        run: cd rust-executor && cargo check 2>&1

      - name: Check sqlite-links feature
        run: cd rust-executor && cargo check --no-default-features --features sqlite-links 2>&1

      - name: Check wasm-languages feature
        if: contains(github.ref, 'wasm-language-runtime')
        run: cd rust-executor && cargo check --features wasm-languages 2>&1

  wasm-sdk:
    name: WASM SDK & Example
    if: contains(github.ref, 'wasm-language-runtime')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build SDK
        run: cd wasm-language-sdk && cargo build --target wasm32-unknown-unknown

      - name: Build example note-store
        run: cd examples/wasm-languages/note-store && cargo build --release --target wasm32-unknown-unknown

      - name: Verify WASM exports
        run: |
          apt-get update && apt-get install -y wabt || true
          wasm-objdump -x examples/wasm-languages/note-store/target/wasm32-unknown-unknown/release/note_store_wasm.wasm 2>/dev/null | grep -E "ad4m_" || echo "wabt not available, skipping export check"

  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-22.04
    container:
      image: coasys/ad4m-ci-linux:latest@sha256:3d6e8b6357224d689345eebd5f9da49ee5fd494b3fd976273d0cf5528f6903ab
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-executor
          cache-on-failure: true

      - name: Run sqlite_service tests
        run: cd rust-executor && cargo test sqlite_service --no-default-features --features sqlite-links -- --nocapture 2>&1

      - name: Run wasm_core tests
        if: contains(github.ref, 'wasm-language-runtime')
        run: cd rust-executor && cargo test wasm_core --features wasm-languages -- --nocapture 2>&1
