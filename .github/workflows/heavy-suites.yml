name: Heavy suites

# The GitHub side of CircleCI's gates (.circleci/scripts/should-run-heavy.sh).
# CircleCI runs no CI on a draft PR: every job halts green. heavy_gate also halts
# rust-tests and the integration suites on a PR whose base is not dev, or a
# branch with no PR. CircleCI starts a pipeline on a push only, so a PR that
# later got ready or was retargeted to dev kept green checks for jobs that never
# ran. This workflow runs on drafts too: it is the one that notices the PR turning
# ready. On each PR event below,
# .github/scripts/heavy-suites-pr.sh sets the commit status `ci/heavy-suites` on
# the head commit:
#
# - pending while the gate skips the suites there;
# - success only once a CircleCI pipeline of that commit has its heavy jobs past
#   the gate (running or done); their ci/circleci checks are the pass or fail.
#   It waits for CircleCI's own pipeline, and starts one for the branch when none
#   of the commit's pipelines ran them (e.g. they halted before the PR got ready).
#   That pipeline runs every job, the light ones too.
# - for a ready PR whose heavy suites are not due (its base is not dev), it still
#   starts a pipeline when the commit's pipeline halted `build` on the draft, so
#   the light jobs run; the status stays pending.
# - pending with what clears it in every other case. "Re-run" means re-running
#   this workflow: it looks again and starts what is missing.
#
# Why the job polls CircleCI: a `status`, `check_suite` or `workflow_run`
# workflow runs only from the default branch (dev), so it could not be tried on
# its own PR, and a `status` workflow would start once per CircleCI context. The
# wait is bounded: build takes 6.4 min median, 18.5 min p95 (CircleCI insights,
# dev, Nov 2026), and the heavy jobs start right after it.
#
# Secrets and settings (none of them is required for the status):
# - secret CIRCLECI_API_TOKEN: a CircleCI personal API token that can trigger
#   pipelines in the project; also as a Dependabot secret of the same name for
#   Dependabot PRs. Reads need no token (the project is public). Without it no
#   pipeline starts and the status says so.
# - variable CIRCLECI_PIPELINE_DEFINITION_ID: Project Settings → Pipelines in
#   CircleCI. Optional while the project has one pipeline definition.
#
# A fork PR gets nothing: its token is read-only and it has no secrets, and
# CircleCI does not build fork PRs on this project either. The script says so in
# the log.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, labeled, unlabeled]

# Dependabot PRs get a read-only token unless the workflow asks; these ask.
permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  status:
    # A title or body edit, or a label other than full-ci, changes nothing.
    if: >-
      (github.event.action != 'edited' || github.event.changes.base) &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'full-ci')
    runs-on: ubuntu-latest
    # The script waits up to 30 min of wall time (HEAVY_SUITES_WAIT_SECS), API
    # time included, and posts its last status by about 33 min; the margin
    # keeps the job's timeout from cutting that status off.
    timeout-minutes: 40
    # One run per PR. A newer event cancels a running one: the script keeps no
    # state, so the next run finds a pipeline the cancelled one started. Every
    # pending it leaves behind names the re-run.
    concurrency:
      group: heavy-suites-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # The merge commit and its parents: the scripts, and the head commit's
      # message for [full-ci].
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Status and CircleCI pipeline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CIRCLECI_API_TOKEN: ${{ secrets.CIRCLECI_API_TOKEN }}
          CIRCLECI_PIPELINE_DEFINITION_ID: ${{ vars.CIRCLECI_PIPELINE_DEFINITION_ID }}
        run: bash .github/scripts/heavy-suites-pr.sh
