# Direct Message Language Tests - Uses Docker container for consistent environment
# Migrated from Tryorama (TypeScript) to sweettest (Rust) for stability

name: Direct Message Language

on:
  push:
    branches:
      - main
      - staging
      - bootstrap-languages

jobs:
  sweettest:
    name: Sweettest
    runs-on: ubuntu-latest
    container:
      image: coasys/ad4m-ci-linux:latest@sha256:3605cfd2c0aee389ac9e7bb499a8e2633d0367ef3cc148d6668b2dbdff846ce0

    steps:
    - uses: actions/checkout@v3

    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          bootstrap-languages/direct-message-language/hc-dna/target/
        key: ${{ runner.os }}-direct-message-rust-${{ hashFiles('bootstrap-languages/direct-message-language/hc-dna/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-direct-message-rust-

    # Rust toolchain configured via rust-toolchain.toml
    - name: Verify Rust toolchain
      run: rustc --version && cargo --version && hc --version

    - name: Build DNA
      working-directory: bootstrap-languages/direct-message-language/hc-dna
      run: bash build.sh

    - name: Run sweettest integration tests
      working-directory: bootstrap-languages/direct-message-language/hc-dna/tests/sweettest
      run: cargo test --test integration -- --nocapture

    - name: Save Rust cache
      if: success()
      uses: actions/cache/save@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          bootstrap-languages/direct-message-language/hc-dna/target/
        key: ${{ runner.os }}-direct-message-rust-${{ hashFiles('bootstrap-languages/direct-message-language/hc-dna/Cargo.lock') }}
