# Publishes the bootstrap languages of a staging release and commits the
# release's network seed (cli/mainnet_seed.json and the copy the binary
# compiles in, rust-executor/src/mainnet_seed.json) onto the release branch.
#
# Run it on the head branch of the staging.N PR, before that PR is merged:
#   gh workflow run bootstrap-publish.yml -R coasys/ad4m --ref release/0.13.1-staging.6
#
# The seed is built from cli/seed_proto.json and the languages built here. The
# publish job signs with the trusted agent kept in the `bootstrap-publish`
# environment, so it waits for a required reviewer before it can read the key.
# The build runs in a job without the key: nothing that `pnpm install` or a
# build script runs ever sees it.

name: Bootstrap publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-publish
  cancel-in-progress: false

defaults:
  run:
    # -o pipefail: a failed check piped into tee fails its step.
    shell: bash

jobs:
  build:
    # GitHub-hosted: a self-hosted runner keeps files between jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: coasys/ad4m-ci-linux:latest@sha256:16a04358abc4b12ea4cf3a231cfdfea38ac6ae0cc4f937f6c0ed5d98dfb574e7
    steps:
      - name: Only on a release branch
        if: ${{ !startsWith(github.ref, 'refs/heads/release/') }}
        run: |
          echo "::error::Run this on the head branch of a staging release PR (release/*), not ${{ github.ref }}"
          exit 1

      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install the pinned hc (DNAs must be packed with the Cargo.lock version)
        run: |
          bash scripts/install-hc-toolchain.sh
          # Only the binaries are needed; the hc build tree takes disk the
          # executor build needs.
          rm -rf .hc-toolchain/src

      - name: wasm-bindgen for the agent-language build
        run: wasm-bindgen --version 2>/dev/null | grep -q ' 0.2.118$' || cargo install wasm-bindgen-cli --version 0.2.118

      - run: pnpm install --no-frozen-lockfile

      - name: Build the executor
        env:
          RUSTY_V8_MIRROR: https://github.com/coasys/rusty_v8/releases/download
        run: pnpm build-libs

      - name: Build the bootstrap languages
        run: pnpm run build-languages

      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-build
          path: |
            target/release/ad4m-executor
            bootstrap-languages/*/build/bundle.js
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: coasys/ad4m-ci-linux:latest@sha256:16a04358abc4b12ea4cf3a231cfdfea38ac6ae0cc4f937f6c0ed5d98dfb574e7
    # Holds AD4M_BOOTSTRAP_AGENT_JSON and AD4M_BOOTSTRAP_PASSPHRASE.
    environment: bootstrap-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bootstrap-build

      - name: Publish the languages and write the seed
        working-directory: cli
        env:
          AD4M_BOOTSTRAP_AGENT_JSON: ${{ secrets.AD4M_BOOTSTRAP_AGENT_JSON }}
          AD4M_BOOTSTRAP_PASSPHRASE: ${{ secrets.AD4M_BOOTSTRAP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$AD4M_BOOTSTRAP_AGENT_JSON" ] || [ -z "$AD4M_BOOTSTRAP_PASSPHRASE" ]; then
            echo "::error::The bootstrap-publish environment is missing AD4M_BOOTSTRAP_AGENT_JSON or AD4M_BOOTSTRAP_PASSPHRASE"
            exit 1
          fi
          # Every file written from here on, the agent copy in
          # ~/.ad4m-publish included, is readable by this user only.
          umask 077
          agent="$RUNNER_TEMP/agent.json"
          trap 'rm -f "$agent"; rm -rf "$HOME/.ad4m-publish"' EXIT
          printf '%s' "$AD4M_BOOTSTRAP_AGENT_JSON" > "$agent"
          # Neither secret is left in the environment the executor inherits.
          passphrase="$AD4M_BOOTSTRAP_PASSPHRASE"
          unset AD4M_BOOTSTRAP_AGENT_JSON AD4M_BOOTSTRAP_PASSPHRASE
          chmod +x ../target/release/ad4m-executor
          # `-`: the passphrase comes from stdin, not the process's arguments.
          printf '%s\n' "$passphrase" \
            | ../target/release/ad4m-executor dev generate-bootstrap "$agent" - seed_proto.json

      - name: Check every pinned language is installable
        run: |
          command -v jq >/dev/null || { apt-get update && apt-get install -y jq; }
          cmp cli/mainnet_seed.json rust-executor/src/mainnet_seed.json
          scripts/verify-bootstrap-seed.sh cli/mainnet_seed.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the seed onto the release branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git diff --quiet -- cli/mainnet_seed.json rust-executor/src/mainnet_seed.json; then
            echo "The seed is unchanged." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/mainnet_seed.json rust-executor/src/mainnet_seed.json
          git commit -m "chore(seed): publish the bootstrap languages for ${GITHUB_REF_NAME}" \
            -m "Bootstrap publish run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Committed the new seed onto ${GITHUB_REF_NAME}: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
