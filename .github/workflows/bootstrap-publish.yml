# Keeps the network seed (cli/mainnet_seed.json and the copy the binary
# compiles in, rust-executor/src/mainnet_seed.json) equal to the bootstrap
# languages the source builds, and publishes those languages when a commit
# reaches staging or main.
#
# A language's address is the hash of its bundle, so the seed needs no key:
# scripts/bootstrap-seed.py computes it from the built bundles. That is why the
# seed is committed *before* the merge, with the code that changes a bundle,
# and only the publish waits for staging or main. A seed commit after the merge
# would come too late: the release's binaries and npm packages are built from
# the merge commit, and publish_staging.yml refuses a second commit under the
# same version.
#
# - Every run (push to dev/staging/main, PR to them): build the languages
#   without secrets and fail if the committed seed pins other addresses. The
#   built seed is in the run's `built-seed` artifact: copy it to both paths.
# - Push to staging or main: if a pinned language is not yet in the store,
#   signed by a trusted agent, build the executor and publish with the trusted
#   agent of the `bootstrap-publish` environment, then check the store again.
#   The publish job writes nothing to the repo.
#
# The build jobs never see the key: nothing that `pnpm install` or a build
# script runs can read it.

name: Bootstrap seed

on:
  push:
    branches: [dev, staging, main]
    # Anything that can change a built bundle, generously. Same list below.
    paths:
      - bootstrap-languages/**
      - ad4m-ldk/**
      - core/**
      - cli/seed_proto.json
      - cli/mainnet_seed.json
      - rust-executor/src/mainnet_seed.json
      - scripts/bootstrap-seed.py
      - scripts/verify-bootstrap-seed.sh
      - scripts/install-hc-toolchain.sh
      - Cargo.lock
      - rust-toolchain.toml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - deno.lock
      - turbo.json
      - .github/workflows/bootstrap-publish.yml
  pull_request:
    branches: [dev, staging, main]
    paths:
      - bootstrap-languages/**
      - ad4m-ldk/**
      - core/**
      - cli/seed_proto.json
      - cli/mainnet_seed.json
      - rust-executor/src/mainnet_seed.json
      - scripts/bootstrap-seed.py
      - scripts/verify-bootstrap-seed.sh
      - scripts/install-hc-toolchain.sh
      - Cargo.lock
      - rust-toolchain.toml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - deno.lock
      - turbo.json
      - .github/workflows/bootstrap-publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-seed-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # -o pipefail: a failed check piped into tee fails its step.
    shell: bash

jobs:
  seed:
    # GitHub-hosted: a self-hosted runner keeps files between jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: coasys/ad4m-ci-linux:latest@sha256:16a04358abc4b12ea4cf3a231cfdfea38ac6ae0cc4f937f6c0ed5d98dfb574e7
    outputs:
      publish: ${{ steps.store.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: jq
        run: command -v jq >/dev/null || { apt-get update && apt-get install -y jq; }

      - name: Install the pinned hc (DNAs must be packed with the Cargo.lock version)
        run: |
          bash scripts/install-hc-toolchain.sh
          # Only the binaries are needed.
          rm -rf .hc-toolchain/src

      - name: wasm-bindgen 0.2.118 for the agent-language build
        # The image has another version on PATH; this one goes in front of it.
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -q ' 0.2.118$'; then
            cargo install --locked wasm-bindgen-cli --version 0.2.118 --root "$RUNNER_TEMP/wasm-bindgen"
            echo "$RUNNER_TEMP/wasm-bindgen/bin" >> "$GITHUB_PATH"
          fi

      - name: Check the wasm-bindgen version
        run: wasm-bindgen --version | grep ' 0.2.118$'

      - run: pnpm install --no-frozen-lockfile

      - name: Build the languages the seed proto publishes
        # Only these: a language outside the proto can't fail the seed. The
        # proto names each by its bundle, ../bootstrap-languages/<dir>/build/bundle.js.
        run: |
          mapfile -t filters < <(jq -r '[.languageLanguageRef, (.linkLanguages[], .alsoPublish[], .agentLanguage, .neighbourhoodLanguage, .perspectiveLanguage | .resource)][]
            | capture("^\\.\\./(?<d>bootstrap-languages/[^/]+)/").d | "--filter=./" + .' cli/seed_proto.json | sort -u)
          [ "${#filters[@]}" -gt 0 ] || { echo "::error::No language found in cli/seed_proto.json"; exit 1; }
          pnpm exec turbo run build --concurrency=1 "${filters[@]}"

      - name: The committed seed pins the built languages
        run: python3 scripts/bootstrap-seed.py --check --out built-seed.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: built-seed
          path: built-seed.json
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-bundles
          path: bootstrap-languages/*/build/bundle.js
          if-no-files-found: error
          retention-days: 3

      - name: Is every pinned language in the store?
        id: store
        if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main') }}
        run: |
          if scripts/verify-bootstrap-seed.sh cli/mainnet_seed.json | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing the seed's languages." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  executor:
    needs: seed
    if: ${{ needs.seed.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: coasys/ad4m-ci-linux:latest@sha256:16a04358abc4b12ea4cf3a231cfdfea38ac6ae0cc4f937f6c0ed5d98dfb574e7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm install --no-frozen-lockfile

      - name: Build the executor
        env:
          RUSTY_V8_MIRROR: https://github.com/coasys/rusty_v8/releases/download
        run: pnpm build-libs

      - uses: actions/upload-artifact@v4
        with:
          name: executor
          path: target/release/ad4m-executor
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [seed, executor]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: coasys/ad4m-ci-linux:latest@sha256:16a04358abc4b12ea4cf3a231cfdfea38ac6ae0cc4f937f6c0ed5d98dfb574e7
    # Holds AD4M_BOOTSTRAP_AGENT_JSON and AD4M_BOOTSTRAP_PASSPHRASE. Its
    # deployment branches are staging and main; it has no required reviewer.
    environment: bootstrap-publish
    concurrency:
      group: bootstrap-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: bootstrap-bundles
          path: bootstrap-languages

      - uses: actions/download-artifact@v4
        with:
          name: executor
          path: target/release

      - name: Publish the languages
        working-directory: cli
        env:
          AD4M_BOOTSTRAP_AGENT_JSON: ${{ secrets.AD4M_BOOTSTRAP_AGENT_JSON }}
          AD4M_BOOTSTRAP_PASSPHRASE: ${{ secrets.AD4M_BOOTSTRAP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$AD4M_BOOTSTRAP_AGENT_JSON" ] || [ -z "$AD4M_BOOTSTRAP_PASSPHRASE" ]; then
            echo "::error::The bootstrap-publish environment is missing AD4M_BOOTSTRAP_AGENT_JSON or AD4M_BOOTSTRAP_PASSPHRASE"
            exit 1
          fi
          # Every file written from here on, the agent copy in
          # ~/.ad4m-publish included, is readable by this user only.
          umask 077
          agent="$RUNNER_TEMP/agent.json"
          trap 'rm -f "$agent"; rm -rf "$HOME/.ad4m-publish"' EXIT
          printf '%s' "$AD4M_BOOTSTRAP_AGENT_JSON" > "$agent"
          # Neither secret is left in the environment the executor inherits.
          passphrase="$AD4M_BOOTSTRAP_PASSPHRASE"
          unset AD4M_BOOTSTRAP_AGENT_JSON AD4M_BOOTSTRAP_PASSPHRASE
          chmod +x ../target/release/ad4m-executor
          # `-`: the passphrase comes from stdin, not the process's arguments.
          printf '%s\n' "$passphrase" \
            | ../target/release/ad4m-executor dev generate-bootstrap "$agent" - seed_proto.json

      - name: The publish gave the committed seed, and every pinned language is installable
        run: |
          command -v jq >/dev/null || { apt-get update && apt-get install -y jq; }
          # generate-bootstrap rewrote both seed copies from the addresses the
          # store answered. They must still be the committed bytes.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- cli/mainnet_seed.json rust-executor/src/mainnet_seed.json
          scripts/verify-bootstrap-seed.sh cli/mainnet_seed.json | tee -a "$GITHUB_STEP_SUMMARY"
