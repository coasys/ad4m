name: Profile Perspective Scaling

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/js/profile-perspectives.ts'

jobs:
  profile:
    name: Perspective Scaling Benchmark
    runs-on: ubuntu-latest
    container:
      image: coasys/ad4m-ci-linux:latest@sha256:3d6e8b6357224d689345eebd5f9da49ee5fd494b3fd976273d0cf5528f6903ab
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build executor
        run: cargo build --release -p ad4m-executor

      - name: Build test language and prepare test data
        working-directory: tests/js
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run prepare-test

      - name: Run profiler
        working-directory: tests/js
        env:
          AD4M_EXECUTOR_PATH: ${{ github.workspace }}/target/release/ad4m-executor
        run: |
          npx tsx profile-perspectives.ts 2>&1 | tee /tmp/profile-output.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-results
          path: /tmp/profile-output.txt
