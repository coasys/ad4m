        asset_content_type: application/octet-stream

  # ============================================================================
  # Windows Binary Build - Re-enabled now that V8 uses pre-built binaries
  # ============================================================================
  build-launcher-binary-windows:
    runs-on: windows-latest

    needs:
      - create-release

    steps:
    - name: Fetch source code
      uses: actions/checkout@v3

    - name: Enable long paths (Windows MAX_PATH workaround for deno git dep)
      shell: powershell
      run: |
        git config --global core.longpaths true
        reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f

    # Rust toolchain configured via rust-toolchain.toml
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    # Cache Rust deps - biggest time saver
    # shared-key includes Cargo.toml hash so cache busts on version changes
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          rust-executor
          ui/src-tauri
        cache-targets: true
        cache-all-crates: true
        shared-key: "staging-windows-v2-${{ hashFiles('rust-executor/Cargo.toml', 'cli/Cargo.toml') }}"

    - name: Install GO
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.6'
        cache: true

    - name: Install Deno
      uses: denoland/setup-deno@v1
      with:
        deno-version: v2.x

    - name: Use Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - uses: pnpm/action-setup@v4

    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'pnpm'

    - name: Install protobuf compiler
      run: choco install protoc -y

    - name: Extract version
      id: extract_version
      uses: Saionaro/extract-package-version@v1.1.1
      with:
        path: ui

    - name: pnpm Install
      run: pnpm install

    - name: Install core dependencies
      run: cd ./core && pnpm install

    - name: Update cargo git deps (ensure pre-built V8 from coasys/rusty_v8 tag)
      working-directory: rust-executor
      shell: bash
      run: cargo update -p v8 2>/dev/null || cargo update 2>/dev/null || true

    - name: Build AD4M-CLI
      env:
        RUSTY_V8_MIRROR: https://github.com/coasys/rusty_v8/releases/download
      run: pnpm build-libs

    - name: Build Launcher binary
      run: pnpm run package-ad4m

    - name: Upload Release MSI Asset
      id: upload-release-msi-asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: 'target\release\bundle\msi\ADAM Launcher_${{ steps.extract_version.outputs.version }}_x64_en-US.msi'
        asset_name: ADAM Launcher_${{ steps.extract_version.outputs.version }}_x64_en-US.msi
        asset_content_type: application/octet-stream

    - name: Upload Release NSIS Asset
      id: upload-release-nsis-asset
      uses: actions/upload-release-asset@v1
      continue-on-error: true  # NSIS might not be produced depending on tauri config
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: 'target\release\bundle\nsis\ADAM Launcher_${{ steps.extract_version.outputs.version }}_x64-setup.exe'
        asset_name: ADAM Launcher_${{ steps.extract_version.outputs.version }}_x64-setup.exe
        asset_content_type: application/octet-stream

    - name: Upload Release AD4M CLI client Windows Binary
      id: upload-release-windows-ad4m-cli-client-binary
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: target\release\ad4m.exe
        asset_name: ad4m-cli-client-windows-${{ steps.extract_version.outputs.version }}-x64.exe
        asset_content_type: application/octet-stream

    - name: Upload Release AD4M CLI executor Windows Binary
      id: upload-release-windows-ad4m-cli-executor-binary
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: target\release\ad4m-executor.exe
        asset_name: ad4m-cli-executor-windows-${{ steps.extract_version.outputs.version }}-x64.exe
        asset_content_type: application/octet-stream

  # ============================================================================
  # NPM Publish - Plain ubuntu runner (no Docker needed, just TS build + publish)
  # ============================================================================
  npm-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version
        id: extract_version
        uses: Saionaro/extract-package-version@v1.1.1
        with:
          path: ui

      - name: Check if string contains prerelease
        run: |
          STRING="${{ steps.extract_version.outputs.version }}"
          if [[ $STRING == *-* ]]; then
            echo "NPM_TAG=next" >> $GITHUB_ENV
          else
            echo "NPM_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Install core dependencies
        run: cd ./core && pnpm install --no-frozen-lockfile

      - name: Build modules
        run: pnpm run build-npm-packages

      - name: Change Package Visibility to Public
        run: |
          cd core
          sed -i 's/"private": true/"private": false/' package.json

      - name: Publish all npm packages
        run: |
          # Write auth token via both methods to ensure npm/pnpm picks it up
          # actions/setup-node sets NPM_CONFIG_USERCONFIG to a temp .npmrc — write auth there
          TARGET_NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$TARGET_NPMRC"
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          echo "npm version: $(npm --version), node: $(node --version)"
          echo "npmrc target: $TARGET_NPMRC ($(wc -c < "$TARGET_NPMRC") bytes)"
          TAG="${{ env.NPM_TAG }}"
          echo "Publishing with tag: $TAG"
          FAILED=0
          for PKG in core connect ad4m-hooks/helpers ad4m-hooks/react ad4m-hooks/vue executor test-runner; do
            echo "=== Publishing $PKG ==="
            set +e
            OUTPUT=$(cd "$PKG" && npm publish --access public --tag "$TAG" --registry https://registry.npmjs.org 2>&1)
            EXIT=$?
            set -e
            echo "$OUTPUT"
            if [ $EXIT -ne 0 ]; then
              if echo "$OUTPUT" | grep -qE "previously published|cannot publish over|already exists|E403.*cannot publish"; then
                echo "SKIP: $PKG already published"
              else
                echo "FAIL: $PKG (exit $EXIT)"
                FAILED=1
              fi
            else
              echo "OK: $PKG published"
            fi
          done
          exit $FAILED
        env:
          NODE_AUTH_TOKEN: ${{ secrets.COASYS_NPM_TOKEN }}

  # ============================================================================
  # Crates Publish - Uses Docker container
  # ============================================================================
  crates-publish:
    runs-on: ubuntu-latest
    container:
      image: coasys/ad4m-ci-linux:latest@sha256:bffabe1dfc4ef18ca64105318d342ab61c2db946ae6ba16718dcd8d1d57c2cff
    steps:
      - uses: actions/checkout@v3

      # Rust toolchain configured via rust-toolchain.toml (auto-detected by rustup)
      - name: Verify Rust toolchain
        run: rustc --version && cargo --version

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build-core-executor
      - run: ls -al executor/lib
      - run: cargo login ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish ad4m-client crate
        working-directory: rust-client
        run: |
          set +e
          OUTPUT=$(cargo publish --allow-dirty 2>&1)
          EXIT=$?
          set -e
          echo "$OUTPUT"
          if [ $EXIT -ne 0 ]; then
            echo "$OUTPUT" | grep -q "already exists" && echo "Already published — OK" || exit $EXIT
          fi
